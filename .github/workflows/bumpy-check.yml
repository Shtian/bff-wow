name: bumpy check

# A PR that changes shipped files needs a bump file (.bumpy/*.md); see
# docs/design/settings-and-release.md. Comments the release plan on the PR.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check bump files
        run: |
          version=$(jq -r '.devDependencies["@varlock/bumpy"]' package.json)
          npx -y "@varlock/bumpy@$version" ci check
        env:
          GH_TOKEN: ${{ github.token }}
