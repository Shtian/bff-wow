name: release

# Merging to main opens or updates the "Versioned release" PR. Merging that PR
# publishes: bumpy creates a draft release for tag bff@X.Y.Z, runs
# scripts/package.sh to build the zip, upload it to CurseForge and upload it
# and release.json to the release, then
# finalises the release and pushes the tag. See
# docs/design/settings-and-release.md.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What would `ci release` do: version-pr, publish or nothing.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      bumpy_version: ${{ steps.bumpy-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: bumpy-version
        name: Resolve bumpy version
        run: echo "version=$(jq -r '.devDependencies["@varlock/bumpy"]' package.json)" >> "$GITHUB_OUTPUT"

      - id: plan
        run: npx -y "@varlock/bumpy@$BUMPY_VERSION" ci plan
        env:
          BUMPY_VERSION: ${{ steps.bumpy-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}

  version-pr:
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: npx -y "@varlock/bumpy@$BUMPY_VERSION" ci release --expect-mode version-pr
        env:
          BUMPY_VERSION: ${{ needs.plan.outputs.bumpy_version }}
          GH_TOKEN: ${{ github.token }}
          # Optional. Without it the Versioned release PR doesn't trigger the
          # test and bumpy check workflows.
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

  # Lint and tests before publishing, in their own job: bumpy won't publish
  # from a working tree with untracked files, and the Lua setup leaves some.
  test:
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    uses: ./.github/workflows/test.yml

  publish:
    needs: [plan, test]
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The packager checks out CurseForge externals with svn.
      - name: Install svn
        run: command -v svn || (sudo apt-get update && sudo apt-get install -y subversion)

      - run: npx -y "@varlock/bumpy@$BUMPY_VERSION" ci release --expect-mode publish
        env:
          BUMPY_VERSION: ${{ needs.plan.outputs.bumpy_version }}
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}
          # scripts/package.sh uploads to CurseForge when both are set.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}

  # Tells Discord about the release. Never fails the release: it runs after
  # publish, and continue-on-error keeps a failure here from failing the
  # workflow run. Does nothing until the DISCORD_WEBHOOK_URL secret is set.
  # A job here, not a `release: published` workflow: it works with or without
  # BUMPY_GH_TOKEN, and only runs once the zip and the CurseForge upload are done.
  notify-discord:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Post the release to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL isn't set, skipping."
            exit 0
          fi

          # The version the release commit carries. Not "the latest release":
          # if bumpy only warned that it couldn't finalise the release, that
          # would announce the previous one again.
          version=$(gh api "repos/$GH_REPO/contents/package.json?ref=$GITHUB_SHA" \
            -H 'Accept: application/vnd.github.raw' | jq -r .version)
          release=$(gh release view "bff@$version" --json tagName,url,body,isDraft)
          if [ "$(jq -r .isDraft <<<"$release")" = true ]; then
            echo "bff@$version is still a draft, skipping."
            exit 0
          fi

          # Each entry's bump level becomes an icon, and the biggest level in the
          # release sets the embed's colour and its footer.
          # Embed descriptions hold 4096 characters; keep it a short read.
          payload=$(jq -n \
            --argjson release "$release" \
            --arg version "$version" \
            '($release.body // "") as $body
            | (if ($body | test("\\*\\(major\\)\\*")) then "major"
               elif ($body | test("\\*\\(minor\\)\\*")) then "minor"
               else "patch" end) as $level
            | { major: { icon: "🚨", color: 15548997, label: "Major release: everyone in the Crew should update together" },
                minor: { icon: "✨", color: 16765258, label: "Minor release: something new" },
                patch: { icon: "🔧", color: 4183776, label: "Patch release: fixes and tweaks" } } as $levels
            | {
              username: "BFF releases",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: ("🔥 BFF " + $version + " is out"),
                url: $release.url,
                description: (
                  $body
                  # Bumpy appends a "Published to" list and a metadata comment.
                  | sub("(?s)\\n*#### Published to.*$"; "")
                  # "- *(patch)*" then the entry on the next line becomes "- 🔧 entry".
                  | gsub("- \\*\\((?<l>major|minor|patch)\\)\\*\\s+"; "- " + $levels[.l].icon + " ")
                  # Cut at a word, and point to the rest.
                  | if length > 1500
                    then (.[0:1500] | sub("\\s+\\S*$"; "")) + "…\n\n[Read the rest](" + $release.url + ")"
                    else . end
                  | if . == "" then "See the release notes." else . end
                ),
                color: $levels[$level].color,
                footer: { text: $levels[$level].label }
              }]
            }')

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "$payload" "$DISCORD_WEBHOOK_URL")
          echo "Discord answered $status"
          case "$status" in 2??) ;; *) exit 1 ;; esac
