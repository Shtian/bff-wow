<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BFF demo prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Archivo+Narrow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
</head>
<body>
<!-- PROTOTYPE: a web mock of the addon's frames, for recording demos. Not the addon. See README.md. -->
<div id="stage">
  <img id="world" src="assets/backdrop.jpg" alt="">
  <div id="chat"></div>
  <div id="mm" data-hover data-tip="mm" data-act="mm"></div>
  <div id="ui">
    <div id="panel" hidden></div>
    <div id="away" hidden></div>
    <div id="toasts"></div>
    <div id="popup" hidden></div>
    <div id="menu" hidden></div>
    <div id="tooltip" hidden></div>
  </div>
  <div id="card" hidden></div>
  <div id="fade"></div>
  <svg id="cursor" width="30" height="34" viewBox="0 0 30 34" aria-hidden="true">
    <path d="M3 2 L3 25 L9.2 19.6 L13.4 30 L18.6 27.8 L14.4 17.6 L23 17.2 Z" fill="#d9b45b" stroke="#1a1400" stroke-width="2" stroke-linejoin="round"/>
    <path d="M6 8 L6 19 L10 15.6" fill="none" stroke="#fff2c4" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <img id="held" hidden alt="">
</div>
<nav id="picker"></nav>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="scenes.js"></script>
</body>
</html>
