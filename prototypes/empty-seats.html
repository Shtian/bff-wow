<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: what should the Camp's empty seats look like while you're alone in a Crew,
  and what happens when the first friend arrives?
  Decided before this: 2–3 seats while alone, all gone once someone arrives (C).
  Variants (bottom bar, ← →, ?variant=): five seat looks on the real Camp band, drawn with the real sprite sheet.
  Top bar: seat count, founder / joined, pet naps on a seat, label over seats, day / night, and the arrival.
  Hover a seat for its tooltip (the click behaviour, D, is still open: the tooltip lines are placeholders).
  Run: open the file in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empty seats</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#ffd14a; --text:#e8e6e3; --muted:#adabb8; --dim:#8c8a99; --online:#70e370;
    --window:#0e0d14; --header:#1a1821; --warm:255,236,200; --hair:rgba(var(--warm),.075); --border:rgba(var(--warm),.10);
    --narrow:"Arial Narrow","Archivo Narrow",sans-serif; --friz:"Friz Quadrata TT","Friz Quadrata",Cinzel,Georgia,serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--text); font:14px/1.25 var(--narrow);
    background:radial-gradient(ellipse at 30% 20%, #6b4a33 0%, #2b2219 45%, #0d0b09 100%); padding-bottom:80px; }
  .bar-top { display:flex; gap:6px 14px; align-items:center; flex-wrap:wrap; justify-content:center; padding:14px 16px 6px; }
  .grp { display:flex; gap:4px; align-items:center; }
  .grp > span { color:#d9cbb8; font-size:13px; margin-right:2px; }
  .bar-top button { font:13px var(--narrow); color:var(--text); background:rgba(14,13,20,.85); border:1px solid rgba(255,255,255,.14);
    padding:4px 10px; cursor:pointer; }
  .bar-top button.on { background:var(--gold); color:#1a1400; border-color:var(--gold); }
  .bar-top button.go { background:#2c5a33; border-color:#468a46; }
  .note { text-align:center; color:#d9cbb8; font-size:14px; max-width:780px; margin:6px auto 12px; padding:0 16px; min-height:38px; }
  .note b { color:var(--gold); font-weight:600; }
  .stage { display:flex; justify-content:center; padding:0 16px; }
  .panel { width:780px; max-width:100%; background:rgba(14,13,20,.97); border:1px solid var(--border); display:flex; flex-direction:column; }
  .head { height:30px; background:var(--header); border-bottom:1px solid var(--hair); display:flex; align-items:center; padding:0 8px 0 12px; }
  .head .t { font-family:var(--friz); color:var(--gold); font-size:13px; flex:1; }
  .head .s { color:var(--muted); font-size:12px; margin-right:10px; }
  .head .s i { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--online); margin-right:5px; vertical-align:1px; }
  .head .x { color:#8a8a8a; width:22px; text-align:center; }
  .band { position:relative; height:120px; overflow:hidden; background:#0b0c1e; }
  .band canvas { position:absolute; left:0; top:0; image-rendering:pixelated; }
  .body { display:flex; min-height:300px; position:relative; }
  .firelight { position:absolute; left:0; right:0; top:0; height:260px; pointer-events:none;
    background:radial-gradient(ellipse 42% 100% at 50% 0%, rgba(240,140,40,.11), rgba(240,140,40,0) 100%); }
  .side { width:124px; flex:none; border-right:1px solid var(--hair); padding:6px; position:relative; }
  .side div { height:30px; line-height:30px; padding:0 8px; color:var(--muted); }
  .side .sel { background:rgba(var(--warm),.09); color:var(--text); }
  .content { flex:1; display:flex; flex-direction:column; align-items:center; padding:28px 16px; position:relative; }
  .vignette { width:120px; height:66px; background-repeat:no-repeat; image-rendering:pixelated; }
  .content h3 { font-family:var(--friz); font-weight:500; font-size:15px; margin:10px 0 4px; }
  .content p { color:var(--muted); font-size:13px; max-width:300px; text-align:center; margin:0; }
  .code { margin-top:10px; width:128px; height:24px; line-height:22px; text-align:center; border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.4); letter-spacing:.5px; }
  .hint { color:var(--dim); font-size:11px; margin-top:4px; }
  .tip { position:fixed; pointer-events:none; background:rgba(8,8,16,.96); border:1px solid #5a5866; border-radius:3px;
    padding:6px 9px; font-size:13px; max-width:240px; display:none; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.6); }
  .tip .tt { color:#fff; font-size:14px; margin-bottom:2px; }
  .tip .ln { color:var(--gold); }
  .tip .dm { color:var(--muted); }
  .tip .gr { color:var(--online); }
  .switch { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:4px;
    background:#fff; color:#111; border-radius:999px; padding:4px; box-shadow:0 6px 24px rgba(0,0,0,.5); font:600 14px system-ui,sans-serif; z-index:20; }
  .switch button { border:0; background:#eee; border-radius:999px; width:34px; height:34px; cursor:pointer; font-size:16px; }
  .switch button:hover { background:#ddd; }
  .switch span { padding:0 12px; min-width:220px; text-align:center; }
</style>
</head>
<body>
<div class="bar-top">
  <div class="grp"><span>Seats</span><button data-k="count" data-v="2">2</button><button data-k="count" data-v="3">3</button></div>
  <div class="grp"><span>You</span><button data-k="who" data-v="founder">made the Crew</button><button data-k="who" data-v="joined">joined, waiting</button></div>
  <div class="grp"><span>Pet</span><button data-k="pet" data-v="you">by you</button><button data-k="pet" data-v="seat">naps on a seat</button></div>
  <div class="grp"><span>Label</span><button data-k="label" data-v="none">none</button><button data-k="label" data-v="free">"free"</button><button data-k="label" data-v="q">?</button></div>
  <div class="grp"><span>Time</span><button data-k="phase" data-v="night">night</button><button data-k="phase" data-v="day">day</button></div>
</div>
<div class="bar-top">
  <div class="grp"><span>Arrival</span><button data-k="arrive" data-v="walk">walks in</button><button data-k="arrive" data-v="pop">pops in</button><button data-k="arrive" data-v="asleep">arrives asleep (offline)</button></div>
  <button class="go" id="arrive">▶ A friend arrives</button>
  <button id="reset">Reset</button>
</div>
<div class="note" id="note"></div>
<div class="stage">
  <div class="panel">
    <div class="head"><div class="t">Best Friends in Forever</div><div class="s" id="count"><i></i>1 of 1 by the fire</div><div class="x">✕</div></div>
    <div class="band" id="band"><canvas id="cv"></canvas></div>
    <div class="body">
      <div class="firelight"></div>
      <div class="side"><div class="sel">Roster</div><div>Feed</div><div>Goals</div><div>When</div><div>Spares</div><div>Professions</div><div>Dungeons</div></div>
      <div class="content" id="content">
        <div class="vignette" id="vig"></div>
        <h3 id="eh"></h3>
        <p id="ep"></p>
        <div class="code" id="code">K7QD-M2XF</div>
        <div class="hint" id="hint">Ctrl+C to copy</div>
      </div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>
<div class="switch"><button id="prev">←</button><span id="vlabel"></span><button id="next">→</button></div>

  lanternGold:[122,57,5,8], smoke1:[105,71,7,5], smoke2:[114,71,7,5],
  walkCloth1:[58,147,12,13], walk1:[72,147,12,13], walkCloth2:[86,147,12,13], walk2:[100,147,12,13],
  waveCloth1:[114,147,12,13], wave1:[1,162,12,13], waveCloth2:[15,162,12,13], wave2:[29,162,12,13], hi:[43,162,11,11],
  hatCowboy:[57,228,14,7], hatWizard:[43,242,12,7],
  petFox:[42,267,13,10], petFoxIdle:[57,267,13,10], petFoxAsleep:[72,267,13,8],
};
const PAL = { K:"#0b0a12", S:"#e8b890", s:"#b98465", W:"#fff3c4", Y:"#ffe9a0", G:"#ffd14a", O:"#f0a21c", R:"#c9481c",
  B:"#5a3a24", b:"#3a2518", T:"#8c8796", t:"#5d5966", Z:"#adabb8", N:"#ece8d8", A:"#c89a5a", a:"#8f6a3a", r:"#5a1620",
  c:"#8c8c8c", d:"#575757", e:"#6a6f8e", f:"#474b66", h:"#c2b394", i:"#958974" };

const ROLL = [
  ".KKKKKKKKKK.",
  "KfeeKeeeeKeK",
  "KeheKeeeeKfK",
  "KfeeKeeeeKeK",
  ".KKKKKKKKKK.",
];
const MUG = [
  "KKKK..",
  "KYGKK.",
  "KAaK.K",
  "KAaK.K",
  "KAaKK.",
  "KKKK..",
];
const STEAM = [ [[1,0],[2,2],[1,4]], [[2,0],[1,2],[2,4]], [[1,1],[2,3],[1,5]] ];
const POLE = ["B","B","B","B","B","B","B","B","B","B","B","B","B","B"];
const ARM = ["BBBB"];
const BOARD = [
  ".KKKKKKK.",
  "KAAAAAAAK",
  "KAaGaGaAK",
  "KAAAAAAAK",
  ".KKKKKKK.",
  "....B....",
  "....B....",
];
const QMARK = [".ZZZ.","Z...Z","...Z.","..Z..",".....","..Z.."];

const VARIANTS = [
  { key:"log", name:"Plain log", note:"The <b>seat sprite we already ship</b>, alone. Quietest: reads as \"a place by the fire\" and nothing else." },
  { key:"roll", name:"Rolled bedroll", note:"A <b>bedroll rolled up on the log</b>, waiting to be laid out. Says someone is expected and will stay the night." },
  { key:"mug", name:"Mug kept warm", note:"A <b>mug set out on the log</b>, steam rising. Warmest and most alive: something is kept warm for a friend." },
  { key:"lantern", name:"Lantern on a post", note:"A <b>lantern hung on a post</b> over the log. Most like a waymark: a light left on to show the way in. Glows at night." },
  { key:"ghost", name:"Ghost outline", note:"A <b>faint figure-shaped outline</b> on the log, pulsing slowly. Most explicit (\"a person goes here\") and closest to a UI placeholder." },
];

const CLASS = { you:"#C69B6D", friend:"#3FC7EB" };
const COLS = 260, ROWS = 40, UNIT = 3;
const FIRE_X = Math.floor(COLS / 2);
const GAP = 4, FIG = 12, FIRE_ROOM = 9, PET = 13, PET_GAP = 1, SEAT_W = 14, TENT = 36;

const params = new URLSearchParams(location.search);
const state = {
  variant: Math.max(0, VARIANTS.findIndex(v => v.key === params.get("variant"))),
  count: 2, who: "founder", pet: "you", label: "none", phase: "night", arrive: "walk",
};
let arrival = null;
let tick = 0;

const imgs = {};
function load(name, url) { return new Promise(r => { const i = new Image(); i.onload = () => { imgs[name] = i; r(); }; i.src = url; }); }

const cv = document.getElementById("cv");
cv.width = COLS * UNIT; cv.height = ROWS * UNIT;
cv.style.width = COLS * UNIT + "px"; cv.style.height = ROWS * UNIT + "px";
const ctx = cv.getContext("2d");
const off = document.createElement("canvas"); off.width = COLS; off.height = ROWS;
const o = off.getContext("2d");
const tint = document.createElement("canvas"); tint.width = 32; tint.height = 32;
const tc = tint.getContext("2d");

function sprite(name, x, row, opts = {}) {
  const s = S[name]; if (!s) return;
  const y = ROWS - row - s[3];
  o.save();
  if (opts.alpha != null) o.globalAlpha = opts.alpha;
  if (opts.flip) { o.translate(FIRE_X + x + s[2], y); o.scale(-1, 1); o.drawImage(imgs.sprites, s[0], s[1], s[2], s[3], 0, 0, s[2], s[3]); }
  else o.drawImage(imgs.sprites, s[0], s[1], s[2], s[3], FIRE_X + x, y, s[2], s[3]);
  o.restore();
}
function tinted(name, color, x, row, opts = {}) {
  const s = S[name];
  tc.clearRect(0, 0, 32, 32);
  tc.globalCompositeOperation = "source-over";
  tc.drawImage(imgs.sprites, s[0], s[1], s[2], s[3], 0, 0, s[2], s[3]);
  tc.globalCompositeOperation = "multiply"; tc.fillStyle = color; tc.fillRect(0, 0, s[2], s[3]);
  tc.globalCompositeOperation = "destination-in"; tc.drawImage(imgs.sprites, s[0], s[1], s[2], s[3], 0, 0, s[2], s[3]);
  const y = ROWS - row - s[3];
  o.save();
  if (opts.alpha != null) o.globalAlpha = opts.alpha;
  if (opts.flip) { o.translate(FIRE_X + x + s[2], y); o.scale(-1, 1); o.drawImage(tint, 0, 0, s[2], s[3], 0, 0, s[2], s[3]); }
  else o.drawImage(tint, 0, 0, s[2], s[3], FIRE_X + x, y, s[2], s[3]);
  o.restore();
}
function grid(rows, x, row, alpha = 1, pal = PAL) {
  o.save(); o.globalAlpha = alpha;
  rows.forEach((line, j) => {
    for (let i = 0; i < line.length; i++) {
      const ch = line[i]; if (ch === ".") continue;
      o.fillStyle = pal[ch] || "#f0f"; o.fillRect(FIRE_X + x + i, ROWS - row - rows.length + j, 1, 1);
    }
  });
  o.restore();
}
function px(x, row, color, alpha = 1) { o.save(); o.globalAlpha = alpha; o.fillStyle = color; o.fillRect(FIRE_X + x, ROWS - row - 1, 1, 1); o.restore(); }

function layout() {
  const left = { sign:-1, used:0 }, right = { sign:1, used:0 };
  const place = (side, w) => {
    const start = side.used === 0 ? FIRE_ROOM : side.used + GAP;
    side.used = start + w;
    return side.sign > 0 ? start : -start - w;
  };
  const roomier = () => right.used < left.used ? right : left;
  const petByYou = state.pet === "you" && !(arrival && arrival.done && false);
  const youW = FIG + (petByYou ? PET_GAP + PET : 0);
  const youX = place(left, youW);
  const you = { x: petByYou ? youX + PET + PET_GAP : youX, petX: petByYou ? youX : null };
  const seats = [];
  for (let i = 0; i < state.count; i++) {
    const side = roomier();
    const w = state.variant === 3 ? SEAT_W + 6 : SEAT_W;
    const x = place(side, w);
    seats.push({ x: side.sign > 0 ? x : x + (w - SEAT_W), side: side.sign });
  }
  const tentSide = roomier();
  const tentX = place(tentSide, TENT);
  return { you, seats, tentX };
}

function drawSky() {
  const day = state.phase === "day";
  const bd = day ? imgs.day : imgs.night;
  o.drawImage(bd, 256 - FIRE_X, 0, COLS, 64, 0, ROWS - 64, COLS, 64);
  if (day) sprite(tick % 24 < 12 ? "sun1" : "sun2", -FIRE_X + 18, 29);
  else {
    sprite("moon", -FIRE_X + 20, 31);
    [[0.17,33],[0.41,37],[0.69,32],[0.94,36],[0.06,31],[0.29,35],[0.58,34],[0.82,38]].forEach(([f, r], k) => {
      const tw = (tick + k * 7) % 41 < 2;
      sprite(tw ? "starMid" : (k % 2 ? "starDim" : "starMid"), Math.floor(f * COLS) - FIRE_X, r);
    });
  }
}

function drawSeat(seat, i, emptyIdx) {
  const v = VARIANTS[state.variant].key;
  const x = seat.x;
  sprite("seat", x, 3);
  if (v === "roll") grid(ROLL, x + 1, 6);
  if (v === "mug") {
    grid(MUG, x + 4, 6);
    if (state.phase === "night" || true) {
      const f = STEAM[Math.floor(tick / 3) % 3];
      f.forEach(([dx, dy], k) => px(x + 4 + dx, 12 + dy, "#ece8d8", 0.55 - k * 0.15));
    }
  }
  if (v === "lantern") {
    const px0 = seat.side > 0 ? x + SEAT_W + 2 : x - 3;
    const toward = seat.side > 0 ? -1 : 1;
    grid(POLE, px0, 3);
    for (let k = 1; k <= 4; k++) px(px0 + toward * k, 3 + POLE.length - 1, PAL.B);
    const lx = px0 + toward * 4 - 2;
    px(lx + 2, 3 + POLE.length - 2, "#adabb8");
    sprite("lanternGold", lx, 3 + POLE.length - 10);
    if (state.phase === "night") {
      o.save(); o.globalCompositeOperation = "lighter";
      const g = o.createRadialGradient(FIRE_X + lx + 2.5, ROWS - 11, 0, FIRE_X + lx + 2.5, ROWS - 11, 12);
      g.addColorStop(0, "rgba(255,209,74,.22)"); g.addColorStop(1, "rgba(255,209,74,0)");
      o.fillStyle = g; o.fillRect(FIRE_X + lx - 10, ROWS - 24, 25, 24); o.restore();
    }
  }
  if (v === "ghost") {
    const a = 0.32 + 0.12 * Math.sin(tick / 5);
    tinted("seatedCloth", "#c8c4e0", x + 1, 4, { alpha: a });
    sprite("seated", x + 1, 4, { alpha: a });
  }
  const petHere = state.pet === "seat" && seat === petSeat();
  if (petHere) sprite("petFoxAsleep", x + 1, v === "roll" ? 8 : 3 + 3, {});
  if (state.label !== "none") {
    seat.labelText = state.label === "free" ? (state.who === "joined" ? "saved" : "free") : "?";
  } else seat.labelText = null;
}

function drawYou(you) {
  if (you.petX != null) {
    const idle = tick % 30 < 3;
    sprite(idle ? "petFoxIdle" : "petFox", you.petX, 3, { flip: true });
  }
  sprite("seat", you.x - 1, 3);
  tinted("seatedCloth", CLASS.you, you.x, 4);
  sprite("seated", you.x, 4);
  sprite("hatCowboy", you.x - 1, 14);
}

function drawFire() {
  sprite("logs", -7, 3);
  sprite("fire" + (1 + Math.floor(tick) % 3), -5, 5);
  if (state.phase === "night") {
    o.save(); o.globalCompositeOperation = "lighter";
    const g = o.createRadialGradient(FIRE_X, ROWS - 4, 0, FIRE_X, ROWS - 4, 40);
    g.addColorStop(0, "rgba(240,140,40,.25)"); g.addColorStop(1, "rgba(240,140,40,0)");
    o.fillStyle = g; o.fillRect(FIRE_X - 40, ROWS - 40, 80, 40); o.restore();
  }
}

function drawFriend(a, seat) {
  const t = tick - a.start;
  if (a.kind === "walk") {
    const to = seat.x, from = Math.min(COLS - FIRE_X + 2, to + 70);
    const dist = from - to;
    const travel = Math.min(dist, t * 3);
    if (travel < dist) {
      sprite("seat", seat.x, 3);
      const fr = Math.floor(t / 2) % 2 ? "2" : "1";
      tinted("walkCloth" + fr, CLASS.friend, from - travel, 3, { flip: true });
      sprite("walk" + fr, from - travel, 3, { flip: true });
      return;
    }
    const after = t - Math.ceil(dist / 3);
    sprite("seat", seat.x, 3);
    a.landedAt = a.landedAt || tick;
    if (after < 14) {
      const fr = Math.floor(after / 2) % 2 ? "2" : "1";
      tinted("waveCloth" + fr, CLASS.friend, seat.x + 1, 4);
      sprite("wave" + fr, seat.x + 1, 4);
      sprite("hi", seat.x + 1, 18);
    } else seatedFriend(seat);
    a.landed = true;
    return;
  }
  if (a.kind === "pop") {
    sprite("seat", seat.x, 3);
    if (t < 4) { sprite(t % 2 ? "smoke2" : "smoke1", seat.x + 3, 6); }
    else if (t < 10) {
      tinted("hopCloth", CLASS.friend, seat.x + 1, 6); sprite("hop", seat.x + 1, 6);
      if (t < 6) sprite("smoke2", seat.x + 3, 9, { alpha: 0.5 });
    } else seatedFriend(seat);
    a.landed = true; a.landedAt = a.landedAt || tick;
    return;
  }
  if (a.kind === "asleep") {
    if (t < 4) { sprite("seat", seat.x, 3); sprite(t % 2 ? "smoke2" : "smoke1", seat.x + 3, 5); }
    else {
      tinted("asleepCloth", CLASS.friend, seat.x - 2, 3); sprite("asleep", seat.x - 2, 3);
      const z = Math.floor(t / 4) % 3;
      [[7,0],[12,3],[6,5]].forEach(([dx, dr], k) => { if (k <= z) sprite("sleep" + (k + 1), seat.x - 2 + dx, 9 + dr); });
    }
    a.landed = t >= 4; a.landedAt = a.landed ? (a.landedAt || tick) : null;
  }
}
function seatedFriend(seat) {
  tinted("seatedCloth", CLASS.friend, seat.x + 1, 4);
  sprite("seated", seat.x + 1, 4);
  sprite("hatWizard", seat.x + 1, 14);
}

let L;
function petSeat() { return L.seats.find((s, i) => s.side < 0 && !(arrival && i === 0)) || L.seats.find((s, i) => !(arrival && i === 0)); }
function frame() {
  tick++;
  L = layout();
  o.clearRect(0, 0, COLS, ROWS);
  drawSky();
  sprite("tent", L.tentX, 5);
  drawFire();
  drawYou(L.you);
  let emptyIdx = 0;
  L.seats.forEach((seat, i) => {
    seat.labelText = null;
    if (arrival && i === 0) { drawFriend(arrival, seat); return; }
    if (arrival && arrival.landedAt) {
      const since = tick - arrival.landedAt - 2 - i * 3;
      if (since >= 6) return;
      if (since >= 0) { sprite("seat", seat.x, 3, { alpha: Math.max(0, 1 - since / 6) }); sprite(since % 2 ? "smoke2" : "smoke1", seat.x + 3, 4 + since); return; }
    }
    drawSeat(seat, i, emptyIdx++);
  });
  if (state.pet === "seat" && arrival && arrival.landedAt) {
    const since = tick - arrival.landedAt;
    if (since > 4) sprite(since % 6 < 3 ? "petFox" : "petFoxIdle", L.you.x - PET - PET_GAP, 3, { flip: true });
  }

  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(off, 0, 0, COLS * UNIT, ROWS * UNIT);
  label("You", L.you.x + 6, 23, CLASS.you, 1);
  L.seats.forEach((seat, i) => {
    if (arrival && i === 0 && arrival.landed) {
      label("Simbad", seat.x + 7, arrival.kind === "asleep" ? 11 : 23, CLASS.friend, 1);
    } else if (!arrival && seat.labelText) {
      label(seat.labelText, seat.x + 7, VARIANTS[state.variant].key === "mug" || VARIANTS[state.variant].key === "ghost" ? 18 : 12, "#adabb8", 0.75);
    }
  });
  const by = arrival && arrival.landed && arrival.kind !== "asleep" ? 2 : 1;
  document.getElementById("count").innerHTML = `<i></i>${by} of ${arrival && arrival.landed ? 2 : 1} by the fire`;
  sizeBand();
}
function label(text, centreCol, row, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = "13px 'Arial Narrow','Archivo Narrow',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillStyle = "#000"; ctx.fillText(text, (FIRE_X + centreCol) * UNIT + 1, (ROWS - row) * UNIT + 1);
  ctx.fillStyle = color; ctx.fillText(text, (FIRE_X + centreCol) * UNIT, (ROWS - row) * UNIT);
  ctx.restore();
}
function sizeBand() {
  const band = document.getElementById("band");
  const w = band.clientWidth;
  cv.style.left = Math.floor((w - COLS * UNIT) / 2) + "px";
}

const tip = document.getElementById("tip");
cv.addEventListener("mousemove", e => {
  if (!L || arrival) { tip.style.display = "none"; cv.style.cursor = ""; return; }
  const r = cv.getBoundingClientRect();
  const col = (e.clientX - r.left) / UNIT - FIRE_X, row = ROWS - (e.clientY - r.top) / UNIT;
  const hit = L.seats.find(s => col >= s.x - 1 && col <= s.x + SEAT_W + 1 && row >= 2 && row <= 20);
  if (!hit) { tip.style.display = "none"; cv.style.cursor = ""; return; }
  cv.style.cursor = "pointer";
  tip.innerHTML = state.who === "founder"
    ? `<div class="tt">A seat for a friend</div><div class="dm">Share your Crew code and they join with /bff join.</div><div class="ln">K7QD-M2XF</div><div class="gr">Click: put an invite in chat</div><div class="gr">Right-click: show the code</div>`
    : `<div class="tt">Saved for your Crew</div><div class="dm">You're in. The rest of the Crew sits here once you hear from one of them.</div>`;
  tip.style.display = "block";
  tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
cv.addEventListener("mouseleave", () => { tip.style.display = "none"; });

function render() {
  document.querySelectorAll(".bar-top button[data-k]").forEach(b => b.classList.toggle("on", String(state[b.dataset.k]) === b.dataset.v));
  const v = VARIANTS[state.variant];
  document.getElementById("vlabel").textContent = `${String.fromCharCode(65 + state.variant)} (${v.name})`;
  document.getElementById("note").innerHTML = v.note;
  const founder = state.who === "founder";
  document.getElementById("eh").textContent = arrival && arrival.landed ? "" : founder ? "Your Crew hasn't arrived yet" : "Waiting for the Crew";
  document.getElementById("ep").textContent = founder
    ? "Share your Crew code. Members join with /bff join, and show up here once one of them is online."
    : "You're in. The rest of the Crew shows up here once one of them is online.";
  document.getElementById("code").style.display = founder ? "" : "none";
  document.getElementById("hint").style.display = founder ? "" : "none";
  const u = new URL(location); u.searchParams.set("variant", v.key); history.replaceState(null, "", u);
}
document.querySelectorAll(".bar-top button[data-k]").forEach(b => b.addEventListener("click", () => {
  state[b.dataset.k] = b.dataset.k === "count" ? Number(b.dataset.v) : b.dataset.v;
  if (b.dataset.k !== "arrive") arrival = null;
  render();
}));
document.getElementById("arrive").onclick = () => { arrival = { kind: state.arrive, start: tick }; render(); };
document.getElementById("reset").onclick = () => { arrival = null; render(); };
const step = d => { state.variant = (state.variant + d + VARIANTS.length) % VARIANTS.length; arrival = null; render(); };
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  if (e.key === " ") { e.preventDefault(); document.getElementById("arrive").click(); }
});
window.addEventListener("resize", sizeBand);

Promise.all([load("sprites", SPRITES_URL), load("night", NIGHT_URL), load("day", DAY_URL), load("vig", VIG_URL)]).then(() => {
  const vig = document.getElementById("vig");
  vig.style.backgroundImage = `url(${VIG_URL})`;
  vig.style.backgroundSize = `${256 * 3}px ${128 * 3}px`;
  vig.style.backgroundPosition = `-${127 * 3}px -${49 * 3}px`;
  render();
  setInterval(frame, 1000 / 6);
  frame();
});
</script>
</body>
</html>
