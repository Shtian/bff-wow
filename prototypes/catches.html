<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: what should Catches (a Crew-wide catch collection, filled in the
  first time any Member catches each kind of fish or fishing find) look like in the panel?
  Three structurally different variants, switchable with ?variant=A|B|C, the bottom bar or ← →:
    A · Field guide: a grid of tiles, uncaught ones as dim outlines. Collection-first.
        Round 2 (picked): a Show filter picker and a Group picker (Where to fish, the default, or Type),
        both the app's 20px picker opening the game's context menu, as the Roster's Sort.
    B · Ledger: a row per kind, who caught it first and when. Story-first, like the Feed.
    C · Waters: a row per stretch of water (by level), its types as chips. Where-to-fish-first.
  Toggles: counts (Crew total only vs per Member), uncaught names (??? vs shown), a new Crew vs a
  seasoned one, and the panel's minimum size (460×380) vs its default (640×520).
  Follows DESIGN.md: gold only for news (a fresh catch, under 3 days), rarity edges in the game's item
  quality colours (players already read those), no shadows, Friz for titles, Arial Narrow for text.
  The fish list is illustrative (Classic-era names). Forever's real list is still to be researched.
  All data is fake. Run: open the file in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">

<style>

  .head .x { color:var(--dim); font-size:12px; }
  .body { flex:1; display:flex; min-height:0; }
  .side { width:124px; border-right:1px solid var(--line); padding:6px; display:flex; flex-direction:column; flex:none; background:rgba(0,0,0,.25); }
  .side div { height:30px; line-height:30px; padding:0 8px; color:var(--muted); font-size:14px; }

  .bar-ui .sep { width:1px; height:18px; background:#0003; }
</style>
</head>

  mira: { 1:[2,"Teldrassil",4,"Mira Vale"] },
  tor:  { 3:[0.6,"The Barrens",3,"Torvald Ash"] },
  simba: null,
};

const RUNGS = [10, 25, 50, KINDS.length];
const FRESH = 3; // days a catch is news

const q = new URLSearchParams(location.search);
const VARIANTS = [["A","Field guide"],["B","Ledger"],["C","Waters"]];
const state = {
  variant: VARIANTS.some(v => v[0] === q.get("variant")) ? q.get("variant") : "A",
  counts: q.get("counts") === "member", names: q.get("names") === "show", crew: q.get("crew") === "new" ? "new" : "seasoned",
  min: q.get("size") === "min", filter:"all", group: q.get("group") === "type" ? "type" : "where", menu:null, sort:"new", open:null,
};
function save() {
  const p = new URLSearchParams({ variant: state.variant });
  if (state.counts) p.set("counts","member");
  if (state.names) p.set("names","show");
  if (state.crew === "new") p.set("crew","new");
  if (state.min) p.set("size","min");
  if (state.group === "type") p.set("group","type");
  try { history.replaceState(null, "", "?" + p); } catch (e) { /* inline preview */ }
}

// The Crew view: merge every Member's catches; the earliest first catch names who caught it first.
function crewView() {
  const src = state.crew === "new" ? NEW : SEASONED;
  const out = {};
  MEMBERS.forEach(m => {
    const c = src[m.id]; if (!c) return;
    Object.entries(c).forEach(([kid, [ago, zone, n, ch]]) => {
      const e = out[kid] || (out[kid] = { total:0, by:[] });
      e.total += n;
      e.by.push({ m, ago, zone, n, ch });
    });
  });
  Object.values(out).forEach(e => { e.by.sort((a, b) => b.ago - a.ago); e.first = e.by[0]; });
  return out;
}
const ago = d => d < 1/24 ? "just now" : d < 1 ? `${Math.round(d * 24)}h ago` : d < 2 ? "yesterday" : `${Math.round(d)}d ago`;
const isFresh = e => !!(e && e.first && e.first.ago < FRESH);
const who = b => b.m.own ? "You" : b.m.display;
const cls = b => b.m.chars[b.ch];
const nextRung = n => RUNGS.find(r => r > n) || null;
const hidden = (k, e) => !e && !state.names;
const kname = (k, e) => hidden(k, e) ? "???" : k.name;

function icon(k, e, size) {
  const un = !e, edge = k.q > 1 ? `<i class="edge" style="box-shadow:inset 0 0 0 1px ${QC[k.q]}"></i>` : "";
  return `<span class="ic${un ? " un" : ""}${hidden(k, e) ? " unhide" : ""}" data-k="${k.id}" style="width:${size}px;height:${size}px">` +
    `<span class="fb">${k.name[k.name.startsWith("Raw ") ? 4 : 0]}</span><img src="${ICON(k.icon)}" onerror="this.remove()" alt="">${edge}` +
    `${isFresh(e) ? `<i class="fresh"></i>` : ""}</span>`;
}

function summary(view, extra) {
  const n = Object.keys(view).length, r = nextRung(n), last = [...RUNGS].reverse().find(x => x <= n) || 0;
  const ticks = RUNGS.slice(0, -1).map(x => `<i class="tick" style="left:${(x / KINDS.length) * 100}%"></i>`).join("");
  return `<div class="summary"><div class="top"><div class="title">Catches</div>` +
    `<div class="count">${n} <small>of ${KINDS.length} types</small></div></div>` +
    `<div class="bar"><i style="width:${(n / KINDS.length) * 100}%"></i>${ticks}</div>` +
    `<div class="next"><span>${r ? `${r - n} more for the ${r === KINDS.length ? "All types" : r + " types"} trophy` : "All types caught"}</span>` +
    `<span>${last ? `Trophy: ${last} types` : "No fishing trophy yet"}</span></div>${extra || ""}</div>`;
}

function freshList(view, max) {
  return Object.entries(view).filter(([, e]) => isFresh(e)).sort((a, b) => a[1].first.ago - b[1].first.ago).slice(0, max)
    .map(([kid, e]) => ({ k: KIND[kid], e }));
}

// A · Field guide, with a Show filter and a Group picker (by where you fish, or by type).
const FILTERS = [["all","All"],["fish","Fish"],["rare","Rare catches"],["treasure","Treasure"],["missing","Not caught yet"]];
const GROUPS = [["where","Where to fish"],["type","Type"]];
const FUNNEL = `<svg width="10" height="8" viewBox="0 0 10 8" fill="currentColor"><rect x="0" y="0" width="10" height="2"/><rect x="2" y="3" width="6" height="2"/><rect x="4" y="6" width="2" height="2"/></svg>`;
const SORTICON = `<svg width="11" height="9" viewBox="0 0 11 9" fill="currentColor"><rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="3" height="1"/><rect x="0" y="2" width="5" height="1"/><rect x="2" y="3" width="1" height="6"/><rect x="8" y="0" width="1" height="6"/><rect x="6" y="6" width="5" height="1"/><rect x="7" y="7" width="3" height="1"/><rect x="8" y="8" width="1" height="1"/></svg>`;
const passes = (k, view) => state.filter === "all" ? true : state.filter === "missing" ? !view[k.id] : k.cat === state.filter;
function variantA(view) {
  const fl = FILTERS.find(f => f[0] === state.filter)[1], gl = GROUPS.find(g => g[0] === state.group)[1];
  let html = summary(view, `<div class="pickers">` +
    `<span class="picker" data-menu="group">${SORTICON}Group: ${gl}</span>` +
    `<span class="picker" data-menu="filter">${FUNNEL}Show: ${fl}</span></div>`);
  html += `<div class="scroll">`;
  const sections = state.group === "where"
    ? WATERS.map(w => ({ water:w, ks: KINDS.filter(k => k.water === w.id) }))
    : CATS.map(([cat, label]) => ({ label, ks: KINDS.filter(k => k.cat === cat) }));
  let any = false;
  sections.forEach(sec => {
    const shown = sec.ks.filter(k => passes(k, view));
    if (!shown.length) return;
    any = true;
    const got = sec.ks.filter(k => view[k.id]).length, done = got === sec.ks.length;
    if (sec.water) {
      const w = sec.water;
      html += `<div class="fg-sec water"><div class="h"><span><span class="nm">${w.name}</span><span class="lv">${w.lv}</span></span>` +
        `<span class="pc${done ? " done" : ""}">${got} / ${sec.ks.length}</span></div><div class="where">${w.where}</div>` +
        `<div class="fg-grid">${shown.map(k => icon(k, view[k.id], 28)).join("")}</div></div>`;
    } else {
      html += `<div class="fg-sec"><div class="h"><span class="label">${sec.label}</span><span class="label">${got} / ${sec.ks.length}</span></div>` +
        `<div class="fg-grid">${shown.map(k => icon(k, view[k.id], 28)).join("")}</div></div>`;
    }
  });
  if (!any) html += `<div style="padding:16px 12px" class="muted">Nothing to show. The Crew has caught every type.</div>`;
  html += `</div>`;
  const fresh = freshList(view, state.min ? 2 : 3);
  if (fresh.length) html += `<div class="fg-fresh"><div class="label" style="margin-bottom:2px">Fresh</div>` + fresh.map(({ k, e }) =>
    `<div class="r">${icon(k, e, 16)}<span class="t"><span class="c-${cls(e.first)}">${who(e.first)}</span> ` +
    `<span class="gold">${k.cat === "rare" ? "caught " + k.name : "caught the first " + k.name.replace(/^Raw /, "")}</span></span><span class="dim">${e.first.zone} · ${ago(e.first.ago)}</span></div>`).join("") + `</div>`;
  return html;
}

// The picker's menu: the game's context menu, a title and radio items (as the Roster's Sort by).
function openMenu(kind, el) {
  closeMenu();
  const view = window.__view;
  const items = kind === "filter"
    ? FILTERS.map(([id, l]) => [id, l, id === "all" ? KINDS.length : KINDS.filter(k => id === "missing" ? !view[k.id] : k.cat === id).length])
    : GROUPS.map(([id, l]) => [id, l, null]);
  const cur = kind === "filter" ? state.filter : state.group;
  const m = document.createElement("div");
  m.className = "menu";
  m.innerHTML = `<div class="mt">${kind === "filter" ? "Show" : "Group by"}</div>` + items.map(([id, l, n]) =>
    `<div class="mi${id === cur ? " on" : ""}" data-pick="${kind}:${id}"><span class="dot"></span>${l}${n != null ? `<span class="n">${n}</span>` : ""}</div>`).join("");
  document.body.appendChild(m);
  const r = el.getBoundingClientRect();
  m.style.left = r.left + "px"; m.style.top = r.bottom + 2 + "px";
  state.menu = m;
}
function closeMenu() { if (state.menu) { state.menu.remove(); state.menu = null; } }

// B · Ledger
function variantB(view) {
  const sorts = [["new","Newest"],["az","A–Z"],["un","Not caught"]];
  let html = summary(view);
  html += `<div class="lg-tools"><span class="label">Sort</span><div class="chips">${sorts.map(([id, l]) =>
    `<span class="chip${state.sort === id ? " on" : ""}" data-sort="${id}">${l}</span>`).join("")}</div><span class="grow"></span></div>`;
  html += `<div class="scroll">`;
  const row = k => {
    const e = view[k.id], open = state.open === k.id;
    let r = `<div class="lg-row${e ? "" : " un"}" data-open="${k.id}">${icon(k, e, 20)}` +
      `<span class="nm" style="${k.q > 1 && e ? `color:${QC[k.q]}` : ""}">${kname(k, e)}</span>`;
    if (e) r += `<span class="by"><span class="c-${cls(e.first)}">${who(e.first)}</span><span class="dim"> · ${e.first.zone}</span></span>` +
      `<span class="when${isFresh(e) ? " gold" : ""}">${ago(e.first.ago)}</span>`;
    else r += `<span class="by dim">${WATERS.find(w => w.id === k.water).name}</span><span class="when"></span>`;
    r += `</div>`;
    if (open && e) r += `<div class="lg-more">` + (state.counts
      ? e.by.map(b => `<div><span><span class="c-${cls(b)}">${b.ch}</span> <span class="dim">${b.zone}</span></span><span>${b.n} caught</span></div>`).join("")
      : `<div><span>The Crew has caught</span><span>${e.total}</span></div><div><span>Also caught by</span><span>${e.by.slice(1).map(who).join(", ") || "nobody yet"}</span></div>`) + `</div>`;
    return r;
  };
  if (state.sort === "new") {
    const caught = KINDS.filter(k => view[k.id]).sort((a, b) => view[a.id].first.ago - view[b.id].first.ago);
    const rest = KINDS.filter(k => !view[k.id]);
    html += `<div class="lg-group"><span class="label">Caught</span><span class="label">${caught.length}</span></div>` + caught.map(row).join("");
    html += `<div class="lg-group"><span class="label">Not caught yet</span><span class="label">${rest.length}</span></div>` + rest.map(row).join("");
  } else if (state.sort === "az") {
    html += [...KINDS].sort((a, b) => a.name.replace(/^Raw /, "").localeCompare(b.name.replace(/^Raw /, ""))).map(row).join("");
  } else {
    CATS.forEach(([cat, label]) => {
      const ks = KINDS.filter(k => k.cat === cat && !view[k.id]);
      if (ks.length) html += `<div class="lg-group"><span class="label">${label}</span><span class="label">${ks.length} left</span></div>` + ks.map(row).join("");
    });
  }
  return html + `</div>`;
}

// C · Waters
function variantC(view) {
  const fresh = freshList(view, 1)[0];
  let html = "";
  if (fresh) {
    const { k, e } = fresh;
    html += `<div class="wt-hero">${icon(k, e, 40)}<div class="tx"><div class="l1"><span class="c-${cls(e.first)}">${who(e.first)}</span> ` +
      `<span class="gold">${k.cat === "rare" ? "caught " + k.name : "caught the Crew's first " + k.name}</span></div>` +
      `<div class="l2">${e.first.zone} · ${ago(e.first.ago)}</div></div>${e.first.m.own ? "" : `<button class="btn">Cheer</button>`}</div>`;
  }
  const n = Object.keys(view).length;
  html += `<div style="padding:6px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;flex:none">` +
    `<span class="label">Waters</span><span class="label">${n} / ${KINDS.length} types · next trophy at ${nextRung(n) || "—"}</span></div>`;
  html += `<div class="scroll">`;
  WATERS.forEach(w => {
    const ks = KINDS.filter(k => k.water === w.id), got = ks.filter(k => view[k.id]).length, done = got === ks.length;
    html += `<div class="wt-water"><div class="h"><span class="n">${w.name}</span><span class="lv">${w.lv}</span><span class="pc${done ? " done" : ""}">${got}/${ks.length}</span></div>` +
      `<div class="wt-chips">${ks.map(k => { const e = view[k.id];
        return `<span class="wt-chip${e ? "" : " un"}" data-k="${k.id}">${icon(k, e, 16)}` +
          `<span style="${e && k.q > 1 ? `color:${QC[k.q]}` : ""}">${kname(k, e).replace(/^Raw /, "")}</span></span>`; }).join("")}</div>` +
      `<div class="wt-bar${done ? " done" : ""}"><i style="width:${(got / ks.length) * 100}%"></i></div></div>`;
  });
  return html + `</div>`;
}

// The same Feed, toast, Goals and While you were away bits for every variant.
function context(view) {
  const n = Object.keys(view).length, fresh = freshList(view, 1)[0];
  const k = fresh ? fresh.k : KIND[35], e = fresh ? fresh.e : null, b = e ? e.first : { m:MEMBERS[1], ch:"Mira Vale", ago:0.08 };
  const line = `<span class="c-${MEMBERS.find(m => m === b.m) ? b.m.chars[b.ch] : "PRIEST"}">${b.m.own ? "You" : b.m.display}</span> ` +
    `<span class="gold">${k.cat === "rare" ? "caught " + k.name : "caught the Crew's first " + k.name}</span>`;
  const medals = RUNGS.map((r, i) => {
    const got = n >= r, foot = ["var(--q2)","var(--q3)","var(--q4)","#ff8000"][i];
    return `<div class="medal${got ? "" : " open"}"><div class="m">${icon({ ...KIND[19], q:1 }, true, 40)}${got ? `<i class="foot" style="background:${foot}"></i>` : ""}</div>` +
      `<div class="${got && i === 0 && state.crew === "seasoned" ? "gold" : ""}">${r === KINDS.length ? "All types" : r + " types"}</div><div class="d">${got ? ["3 Nov","5 Nov","",""][i] : `${n}/${r}`}</div></div>`;
  }).join("");
  document.getElementById("ctx").innerHTML =
    `<div><div class="cap">Feed entry (Cheer)</div><div class="card feedrow">${icon(k, true, 24)}<div class="tx">${line}<div class="tm">${ago(b.ago)}</div></div><button class="btn">Cheer</button></div></div>` +
    `<div><div class="cap">Toast (Live event)</div><div class="toast">${icon(k, true, 24)}<div class="tx">${line}</div><i class="timer"></i></div></div>` +
    `<div><div class="cap">Goals tab: a Fishing track (types caught)</div><div class="card track">${medals}</div></div>` +
    `<div><div class="cap">While you were away</div><div class="card" style="font-size:13px">` +
      `<div class="label" style="margin-bottom:4px">Catches</div>` +
      `<div>+${freshList(view, 99).length} new types since you left <span class="dim">(${[...new Set(freshList(view, 99).map(f => who(f.e.first)))].join(", ") || "none"})</span></div>` +
      (fresh ? `<div style="margin-top:3px">${line}</div>` : "") + `</div></div>`;
}

function render() {
  document.body.classList.toggle("min", state.min);
  const view = crewView();
  window.__view = view;
  const fn = { A:variantA, B:variantB, C:variantC }[state.variant];
  document.getElementById("content").innerHTML = fn(view);
  context(view);
  const v = VARIANTS.find(v => v[0] === state.variant);
  document.getElementById("vlab").textContent = `${v[0]} · ${v[1]}`;
  document.getElementById("t-counts").classList.toggle("on", state.counts);
  document.getElementById("t-names").classList.toggle("on", state.names);
  document.getElementById("t-crew").classList.toggle("on", state.crew === "new");
  document.getElementById("t-min").classList.toggle("on", state.min);
  save();
}

// Tooltip for any icon or Waters chip.
const tip = document.getElementById("tip");
document.addEventListener("mouseover", e => {
  document.querySelectorAll(".ic.hot").forEach(n => n.classList.remove("hot"));
  const el = e.target.closest("[data-k]");
  if (!el || !el.closest(".content")) { tip.style.display = "none"; return; }
  const k = KIND[el.dataset.k], v = window.__view[k.id], w = WATERS.find(x => x.id === k.water);
  if (el.classList.contains("ic")) el.classList.add("hot");
  let html = `<div class="t1" style="color:${v || state.names ? QC[k.q] : "var(--dim)"}">${kname(k, v)}</div>`;
  if (v) {
    html += `<div>First caught by <span class="c-${cls(v.first)}">${who(v.first)}</span>${v.first.m.own ? "" : ` <span class="m">(${v.first.ch})</span>`}</div>` +
      `<div class="m">${ago(v.first.ago)} · ${v.first.zone}</div><hr>`;
    if (state.counts) v.by.forEach(b => html += `<div class="l"><span class="c-${cls(b)}">${b.ch}</span><span>${b.n}</span></div>`);
    else html += `<div class="l"><span class="m">The Crew has caught</span><span>${v.total}</span></div>` +
      (v.by.length > 1 ? `<div class="m">Also caught by ${v.by.slice(1).map(who).join(", ")}</div>` : "");
  } else {
    html += `<div class="m">Nobody in the Crew has caught this yet.</div><div class="m">Try: ${w.where} (${w.lv})</div>`;
  }
  tip.innerHTML = html;
  const r = el.getBoundingClientRect();
  tip.style.display = "block";
  tip.style.left = Math.min(r.right + 6, innerWidth - 270) + "px"; tip.style.top = r.top - 4 + "px";
});
document.addEventListener("click", e => {
  const pk = e.target.closest("[data-pick]"), mn = e.target.closest("[data-menu]");
  if (pk) { const [kind, id] = pk.dataset.pick.split(":"); state[kind === "filter" ? "filter" : "group"] = id; closeMenu(); render(); return; }
  if (mn) { const open = state.menu && state.menu.dataset.for === mn.dataset.menu; closeMenu(); if (!open) { openMenu(mn.dataset.menu, mn); state.menu.dataset.for = mn.dataset.menu; } return; }
  if (!e.target.closest(".menu")) closeMenu();
  const f = e.target.closest("[data-filter]"), s = e.target.closest("[data-sort]"), o = e.target.closest("[data-open]");
  if (f) { state.filter = f.dataset.filter; render(); }
  if (s) { state.sort = s.dataset.sort; render(); }
  if (o) { const id = +o.dataset.open; state.open = state.open === id ? null : id; render(); }
});
const cycle = d => { closeMenu(); const i = VARIANTS.findIndex(v => v[0] === state.variant); state.variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0]; render(); };
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "Escape") closeMenu();
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
document.getElementById("t-counts").onclick = () => { state.counts = !state.counts; render(); };
document.getElementById("t-names").onclick = () => { state.names = !state.names; render(); };
document.getElementById("t-crew").onclick = () => { state.crew = state.crew === "new" ? "seasoned" : "new"; render(); };
document.getElementById("t-min").onclick = () => { state.min = !state.min; render(); };
render();
</script>
</body>
</html>
