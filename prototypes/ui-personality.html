<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: BFF's window is correct but anonymous. Nothing in it could only belong to a group of friends.
  Where should personality live? Three variants, each with a different answer, switch with the bar at the bottom (or ← →):
    A  The Camp:    in a place. A small pixel diorama of the Crew above the panel. Who's online sits at the fire, the rest sleep.
    B  The Slate:   in a voice. The inn's chalkboard: hand lettering, tally marks, the Feed told per Member, not per timestamp.
    C  The Banners: in the people. Every Member is a standard in their class colour. News is sized by how big it is.
  Views: Roster, Feed, While you were away. Try Cheer and Respects on the Feed: in A they change the scene.
  Honest data: a death entry only has a count (no place or killer) and Crew goals name nobody, so no variant ranks anyone.
  All data is fake. Levels and zones are vanilla range. Sizes match UI/Panel.lua: 640 x 520, min 460 x 380.
  Friz Quadrata loads from a local retail addon if there, else Cinzel. Run: open the file in a browser. ?v=A&view=feed&small=1
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · BFF personality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Archivo+Narrow:wght@400;600&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>

function spr(c, rows, x, y, col) {

const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r => r.map(v => (v+.5)/16));
const rnd = s => { const x = Math.sin(s*127.1)*43758.5453; return x - Math.floor(x); };
function backdrop(c, W, H) {
  const cx = W/2, horizon = H-13;
  const sky = ["#070a1e","#0a0d26","#0e1030","#141335","#1c1636"];
  for (let y=0;y<horizon;y++) for (let x=0;x<W;x++) {
    const f = y/horizon*(sky.length-1), i = Math.floor(f), d = f-i;
    c.fillStyle = sky[Math.min(sky.length-1, i + (d > BAYER[y%4][x%4] ? 1 : 0))]; c.fillRect(x,y,1,1);
  }
  for (let i=0;i<W*.28;i++) { const x=Math.floor(rnd(i+1)*W), y=Math.floor(rnd(i+50)*(horizon-8)); c.fillStyle = rnd(i+9) > .8 ? "#fff3c4" : rnd(i+3) > .5 ? "#7d7f9e" : "#4a4c6e"; c.fillRect(x,y,1,1); }
  c.fillStyle="#d8d4c4"; for (const [dx,dy,w] of [[2,0,4],[1,1,3],[0,2,3],[0,3,3],[0,4,3],[1,5,3],[2,6,4]]) c.fillRect(Math.floor(W*.83)+dx, 4+dy, w, 1);
  for (let x=0;x<W;x++) { const h = 7 + Math.round(3*Math.sin(x*.05)+2*Math.sin(x*.13+1)); c.fillStyle="#0e0f26"; c.fillRect(x,horizon-h,1,h); }
  const pine = (x,h,col) => { for (let y=0;y<h;y++) { const w = Math.floor((y%5+y*.55)*.62)+1; c.fillStyle=col; c.fillRect(x-w,horizon-h+y,w*2+1,1); } c.fillRect(x,horizon,1,2); };
  for (let i=0;i<W/9;i++) { const x=Math.floor(i*9+rnd(i+20)*7), far=Math.abs(x-cx)<30; if (far && rnd(i)>.3) continue; pine(x, 12+Math.floor(rnd(i+70)*(far?5:11)), "#090a18"); }
  const g = ["#141019","#201619","#35231a","#573518","#7a4c18"];
  for (let y=horizon;y<H;y++) for (let x=0;x<W;x++) {
    const dx=(x-cx)/52, dy=(y-(H-5))/9, d=Math.sqrt(dx*dx+dy*dy), v=Math.max(0,1-d)*(g.length-1), i=Math.floor(v);
    c.fillStyle = g[Math.min(g.length-1, i + (v-i > BAYER[y%4][x%4] ? 1 : 0))]; c.fillRect(x,y,1,1);
  }
}
function tent(c, x, y) {
  for (let j=0;j<17;j++) { const w=Math.floor(j*.95)+1; for (let i=-w;i<=w;i++) { const edge=Math.abs(i)===w; c.fillStyle = edge ? "#0b0a12" : i>0 ? "#7d6248" : "#5a4636"; if (Math.abs(i)<j*.32) c.fillStyle="#120e14"; c.fillRect(x+i,y+j,1,1); } }
  c.fillStyle="#ffd14a"; c.fillRect(x,y-5,1,5); c.fillRect(x+1,y-5,3,1); c.fillRect(x+1,y-4,2,1); c.fillStyle="#3a2518"; c.fillRect(x,y-1,1,1);
}

function drawCamp(cv, W, H, actors) {
  const c = cv.getContext("2d");
  if (!cv._bg) { const o=document.createElement("canvas"); o.width=W; o.height=H; const oc=o.getContext("2d"); backdrop(oc,W,H); if (W>160) tent(oc,W/2-78,H-27); cv._bg=o; }
  c.drawImage(cv._bg,0,0);
  const cx=Math.floor(W/2), base=H-3, f=FRAME.n;
  spr(c, LOGS, cx-7, base-4);
  spr(c, FIRE[f%3], cx-5, base-14);
  for (let i=0;i<3;i++) { const life=(f*.7+i*5)%14, x=cx+Math.round(Math.sin(i*2+f*.35)*3+(i-1)*2), y=base-14-life; c.fillStyle = life<7 ? "#ffd14a" : "#c9481c"; if (y>0) c.fillRect(x,Math.floor(y),1,1); }
  actors.forEach(a => {
    const x=cx+a.x, col=CLS[a.cls];
    if (a.t==="sit") { const hop=performance.now()<(a.hopUntil||0); c.fillStyle="#3a2518"; c.fillRect(x-1,base-2,14,2); c.fillStyle="#5a3a24"; c.fillRect(x-1,base-3,14,1); spr(c, hop?HOP:SIT, x, base-14-(hop?2:0), col); }
    if (a.t==="bed") { spr(c, BED, x, base-6, shade(col,.55)); if (Math.floor(f/5)%2===0) { c.fillStyle="#adabb8"; for (const [i,j] of [[0,0],[1,0],[2,0],[3,0],[4,0],[3,1],[2,2],[1,3],[0,4],[1,4],[2,4],[3,4],[4,4]]) c.fillRect(x+11+i, base-11+j, 1, 1); } }
    if (a.t==="grave") { spr(c, GRAVE, x, base-8); if (a.flower) spr(c, FLOWER, x+2, base-3); }
    if (a.spark && Math.floor(f/3)%2===0) spr(c, SPARK, x+15, base-18, col);
  });
}

function campHTML(W=213, H=40, tagged=true, gains) {

    if (gains) return gain ? `<span class="tag gain ${gain.gold?"gold":""}" style="left:${left};bottom:${bottom}px;transform:translateX(-50%)">${gain.text}</span>` : "";

const wob = (w, seed=1) => { let d=`M1 3`; for (let x=12;x<w;x+=14) d+=` Q${x-7} ${3+(rnd(x+seed)-.5)*3.2} ${x} ${3+(rnd(x*3+seed)-.5)*2.4}`; return d; };
const rule = (seed=1) => `<svg class="b-rule" viewBox="0 0 480 6" preserveAspectRatio="none"><path d="${wob(480,seed)}" fill="none" stroke="#e8e6e3" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>`;
function tally(n, seed=0) {
  let p="", x=2; const groups=Math.floor(n/5), rest=n%5;
  const stroke=i=>{ const a=(rnd(seed+i)-.5)*2.4, b=(rnd(seed+i+7)-.5)*2.4; return `M${x+a} ${3+rnd(i)*1.6} L${x+b} ${17-rnd(i+2)*1.6} `; };
  let w=0;
  for (let g=0;g<groups;g++) { const x0=x; for (let i=0;i<4;i++) { p+=stroke(g*9+i); x+=5; } p+=`M${x0-3} 14.5 L${x-1} 5.5 `; x+=7; }
  for (let i=0;i<rest;i++) { p+=stroke(90+i); x+=5; }
  w=Math.max(x,6);
  return `<svg class="b-tally" width="${w}" height="20" viewBox="0 0 ${w} 20" style="overflow:visible"><path d="${p}" fill="none" stroke="#e8e6e3" stroke-width="1.5" stroke-linecap="round" opacity=".8"/></svg>`;
}

  return `<div class="b-line"><span>${said}</span>${word}${others.length?`<span class="dim" style="font:12px var(--narrow)">${others.join(", ")}</span>`:""}<span class="tm">${e.t}</span></div>`;
}
function grouped(day) {
  const es=FEED.filter(e=>e.day===day), order=[...new Set(es.map(e=>e.m||"crew"))];
  return order.map((id,i)=>{ const lines=es.filter(e=>(e.m||"crew")===id);
    const name=id==="crew"?`<span style="color:var(--gold)">The Crew</span>`:`<span style="color:${cc(id)}">${who(id).name}</span>`;
    const body=id==="crew"?lines.map(e=>`<div class="b-line"><span class="big" style="color:var(--gold);font-weight:700">reached 150 Crew levels!</span><span class="tm">${e.t}</span></div>`).join(""):lines.map(line).join("");
    return `<div class="b-grp"><div class="b-name">${name}</div>${body}</div>${rule(i+id.length)}`; }).join("");
}
function renderB() {
  const v=S.view, right=`<span class="on">2 of 5 in tonight</span>`;
  if (v==="away") return awayB();
  const under=`<svg class="chalk" style="left:12px;top:32px" width="212" height="6"><path d="${wob(208,4)}" stroke="#ffd14a" stroke-width="1.5" opacity=".7"/></svg>`;
  let inner;
  if (v==="feed") inner=`<div class="scroll"><div class="b-wrap"><h2 class="b-h">Tonight: a max level and two funerals</h2>${grouped("today")}<div class="b-sub">Last night</div>${grouped("yesterday")}</div></div>`;
  else { const on=CREW.filter(m=>m.online), off=CREW.filter(m=>!m.online);
    inner=`<div class="scroll"><div class="b-wrap"><h2 class="b-h">Who's in tonight</h2><div style="display:grid;grid-template-columns:1fr 92px 68px;column-gap:10px;font:15px var(--hand);color:var(--dim);margin-top:4px"><span></span><span>deaths</span><span></span></div>${on.map(bRow).join("")}<div class="b-sub">Gone to bed</div>${off.map((m,i)=>bRow(m,i+3)).join("")}</div></div><div class="b-foot">Crew code on the back of the slate: <b>RJZX-2X4S</b></div>`; }
  return `<div class="vB">`+shell("Best Friends in Forever",right,under+`<div class="body">${slateSide(v)}<div class="content">${inner}</div></div>`)+(v==="feed"?`<div class="toast">${ico(K.maxLevel[0],K.maxLevel[1]+"8c","width:24px;height:24px")}<div class="m gold">Simba reached max level!</div><button class="word" style="font-size:15px;color:var(--text)">Cheer!</button><div class="tl"></div></div>`:"")+`</div>`;
}
function awayB() {
  return `<div class="popup vB"><div class="head"><span class="t">While you were away</span><span class="x"></span></div><div class="b-note">
  <div class="b-line" style="color:var(--muted)">Don't panic. We wrote it all down.</div>
  <div style="margin-top:8px">${AWAY.map((a,i)=>{const m=who(a.m);return `<div class="b-grp" style="padding:5px 0"><div class="b-line" style="font-weight:400"><span style="color:${CLS[m.cls]};font-size:20px">${m.name}</span><span>${a.max?`<span class="big">went from ${a.from} to max level!</span>`:`went from ${a.from} to ${a.to}`}</span>${a.deaths?`<span style="margin-left:auto;align-self:center;display:flex;gap:6px;align-items:center;font-size:15px;color:var(--dim)">deaths ${tally(a.deaths,5)}</span>`:""}</div></div>${a.alt?`<div style="font-size:13px;color:var(--muted);margin:-3px 0 5px">${a.alt}</div>`:""}${rule(i+6)}`;}).join("")}</div>
  <div class="b-line" style="margin-top:8px"><span class="gold">Simone and Simba cheered your ding to 28.</span></div>
  <div class="b-line" style="justify-content:flex-end;color:var(--muted);margin-top:6px">Love, the Crew</div>
  <div class="acts"><button class="btn">Dismiss</button><button class="btn primary">Open Feed</button></div></div></div>`;
}

/* ---------- C ---------- */
const LATEST = { you:"dinged 28", simone:"died 2 times", simba:"reached max level!", simbad:"Alt Bjarne dinged 12", mirelle:"reached 150 Alchemy" };
const banner = m => { const on=m.online, h=on?296:(m.seen==="2 days ago"?238:258);
  return `<div class="ban ${on?"on":"off"}" style="--c:${CLS[m.cls]};${m.fresh?"--e:var(--gold);":""}--h:${h}px;--mix:${on?"30%":"16%"}"><div class="out"><div class="in">${ico(SIG(m.cls),"rgba(255,255,255,.25)","")
    .replace('class="ico"','class="ico sig"')}<div class="nm">${esc(m.name)}</div><div class="mn">${m.main!==m.name?esc(m.main):""}</div><div class="lv num">${m.lvl}</div><div class="xp"><i style="width:${m.xp*100}%"></i></div><div class="zn">${m.zone}</div><div class="ln"></div><div class="la ${m.fresh?"news":""}">${LATEST[m.id]}</div><div class="st">${on?(m.you?"you":"online"):m.seen}</div></div></div>${m.fresh?'<span class="nw">NEW</span>':""}${m.alts?`<div class="alts">+ ${m.alts.map(a=>`${a.name} ${a.lvl}`).join(", ")}</div>`:""}</div>`; };
const pen = (id,k,c) => `<div class="pen" style="--c:${c||(id?cc(id):"var(--gold)")}">${ico(K[k][0],"transparent")}</div>`;
function cEntry(e) {
  const by=reactors(e), c=e.m?cc(e.m):"#ffd14a";
  if (e.k==="maxLevel") { const m=who(e.m); return `<div class="c-hero"><div class="ban bigban"><div class="out"><div class="in">${ico(SIG(m.cls),"rgba(255,255,255,.25)").replace('class="ico"','class="ico sig"')}<div class="lv num">${e.to}</div></div></div></div><div class="tx"><div class="tt">Simba reached<br>max level!</div><div class="ss">${e.t}${by.length?` · <img src="${ICON(R.cheer)}" style="width:13px;height:13px" alt=""> ${by.join(", ")}`:""}</div></div>${react(e)}</div>`; }
  const quiet=e.k==="prof"||(e.k==="ding"&&e.alt);
  if (quiet) return `<div class="c-e quiet">${pen(e.m,e.k)}<div class="tx"><div>${esc(e.text)}</div><div>${e.t}</div></div>${react(e)}</div>`;
  const dead=e.k==="death";
  return `<div class="c-e">${pen(e.m,e.k,dead?"#6e6b78":undefined)}<div class="tx"><div class="${e.news?"gold":""}">${esc(e.text)}</div><div>${e.t}${by.length?` · ${by.join(", ")}`:""}</div></div>${react(e)}</div>`;
}
function renderC() {
  const v=S.view; if (v==="away") return awayC();
  const nav=`<div class="tabs">${tabs.map(t=>`<div data-tab="${t.toLowerCase()}" class="${t.toLowerCase()===v?"sel":""}">${t}</div>`).join("")}<div class="grow"></div><div>Settings</div></div>`;
  const right=`<span class="on"><i></i>2 of 5 online</span>`;
  let inner;
  if (v==="feed") { const day=d=>FEED.filter(e=>e.day===d).map(cEntry).join(""); inner=`<div class="scroll"><div class="label">TODAY</div><div class="c-feed">${day("today")}</div><div class="label" style="margin-top:0">YESTERDAY</div><div class="c-feed">${day("yesterday")}</div></div>`; }
  else inner=`<div class="wall"><div class="rod"></div><div class="bans">${CREW.map(banner).join("")}</div></div><div class="c-news">${ico(K.maxLevel[0],K.maxLevel[1]+"8c")}<div class="m gold">Simba reached max level!</div><span>Crew code</span><span style="color:var(--text);font-size:13px">RJZX-2X4S</span></div>`;
  return `<div class="vC">`+shell("Best Friends in Forever",right,nav+`<div class="content">${inner}</div>`)+(v==="feed"?`<div class="toast"><div class="pen" style="--c:var(--gold);height:36px">${ico(K.maxLevel[0],"transparent")}</div><div class="m gold">Simba reached max level!</div><button class="react"><img src="${ICON(R.cheer)}" alt="Cheer"></button><div class="tl"></div></div>`:"")+`</div>`;
}
function awayC() {
  const b=AWAY.map(a=>{const m=who(a.m);return `<div class="ban on" style="--c:${CLS[m.cls]};${a.max?"--e:var(--gold);":""}--h:152px;--mix:30%"><div class="out"><div class="in">${ico(SIG(m.cls),"rgba(255,255,255,.25)").replace('class="ico"','class="ico sig"')}<div class="nm">${m.name}</div><div class="gn num" style="${a.max?"color:var(--gold)":""}">${a.gain}</div><div class="lvl2">${a.max?"max level":`now ${a.to}`}</div><div class="dd">${a.deaths?`${a.deaths} deaths`:""}</div></div></div></div>`;}).join("");
  return `<div class="popup vC"><div class="head"><span class="t">While you were away</span><span class="x"></span></div><div class="pop-pad"><div class="muted" style="margin-bottom:10px;text-align:center">7 things happened while you were away.</div><div class="c-away">${b}</div>
  <div class="label" style="margin:10px 0 4px">ALTS</div><div class="muted" style="font-size:13px">Simone's Alt Simonetta is new, level 5 · Simbad's Alt Bjarne +2, now 12</div>
  <div class="label" style="margin:10px 0 4px">YOUR CREW NOTICED</div><div class="gold">${NOTICED}</div>
  <div class="acts"><button class="btn">Dismiss</button><button class="btn primary">Open Feed</button></div></div></div>`;
}

const NAMES={A:"The Camp",B:"The Slate",C:"The Banners"}, VIEWS={roster:"Roster",feed:"Feed",away:"While you were away"};
function render() {
  document.body.classList.toggle("small",S.small);
  const world=document.getElementById("world");
  world.style.backgroundImage=`url("../docs/gallery/shots/${S.view==="away"?"away":"feed"}.jpg")`;
  const view=VIEWS[S.view]?S.view:"roster"; S.view=view;
  world.innerHTML=({A:renderA,B:renderB,C:renderC})[S.v]();
  startCamp();
  document.getElementById("proto").innerHTML=Object.keys(NAMES).map(k=>`<button data-v="${k}" class="${k===S.v?"on":""}">${k} ${NAMES[k]}</button>`).join("")+"<i></i>"+Object.keys(VIEWS).map(k=>`<button data-view="${k}" class="${k===S.view?"on":""}">${VIEWS[k]}</button>`).join("")+`<i></i><button data-small class="${S.small?"on":""}">Min size</button>`;
  const p=new URLSearchParams({v:S.v,view:S.view}); if (S.small) p.set("small","1"); if (q.get("shot")) p.set("shot","1"); history.replaceState(null,"","?"+p);
}
function fit() { const s=Math.min(innerWidth/1920,innerHeight/1080); const w=document.getElementById("world"); w.style.transform=`scale(${s})`; w.style.left=(innerWidth-1920*s)/2+"px"; w.style.top=(innerHeight-1080*s)/2+"px"; }
addEventListener("resize",fit); fit();
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-v]"),vw=e.target.closest("[data-view]"),sm=e.target.closest("[data-small]"),t=e.target.closest("[data-tab]"),r=e.target.closest("[data-react]");
  if (v) S.v=v.dataset.v; else if (vw) S.view=vw.dataset.view; else if (sm) S.small=!S.small;
  else if (t) { if (VIEWS[t.dataset.tab]) S.view=t.dataset.tab; else return; }
  else if (r) { const en=FEED.find(x=>x.id==r.dataset.react); (en.r==="respects"?S.respected:S.cheered).add(en.id); render();
    if (S.v==="A"&&en.m) { const a=camp.list[0]&&camp.list[0].actors.find(x=>x.id===en.m); if (a) a.hopUntil=performance.now()+700; } return; }
  else return;
  render();
});
addEventListener("keydown",e=>{ if (!["ArrowLeft","ArrowRight"].includes(e.key)) return; const k=Object.keys(NAMES),i=k.indexOf(S.v); S.v=k[(i+(e.key==="ArrowRight"?1:k.length-1))%k.length]; render(); });
render();
document.fonts && document.fonts.ready.then(()=>{ window.READY=true; });
</script>
</body>
</html>
