<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: what should a shapeshifted Member look like in the Pocket Camp?
  (Ghost Wolf for shamans; Bear, Cat, Travel, Aquatic and Moonkin for druids.)
  Three takes, same scene (the real Pocket Camp backdrop, fire, logs and seated figures):
    A  Animal in the seat: the form replaces the figure, standing still by the fire.
    B  Figure in a pelt: the class-tinted figure keeps its seat and wears the form's ears or antlers.
    C  Alive: A's animals breathe, blink and swish; the travel forms trot to and fro by their seat;
       shifting puffs leaves (druid) or spirit wisps (shaman); the Ghost Wolf's glow pulses.
  Click a figure to shift it to its next form. Keys: ←/→ variant, 1–3 zoom.
  Grids are between GRIDS-BEGIN/END, fill only; outlined() adds the rim like scripts/camp-art.mjs.
  Crew data is fake. Run: open the file, or serve the folder.
-->

  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text); background:#14121b; font:14px/1.35 "Arial Narrow", system-ui, sans-serif; padding-bottom:90px; }
  h1 { font:600 18px system-ui; margin:20px 16px 4px; text-align:center; }
  .note { text-align:center; color:var(--muted); max-width:760px; margin:0 auto 16px; padding:0 16px; min-height:40px; }
  .stage { display:flex; justify-content:center; padding:0 16px; overflow-x:auto; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  #scene { cursor:pointer; border-radius:6px; }
  .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 16px; }
  .row button { font:13px system-ui; color:var(--text); background:#1b1a23; border:1px solid rgba(255,255,255,.14); padding:5px 11px; border-radius:4px; cursor:pointer; }
  .row button.on { background:var(--gold); color:#1a1400; border-color:var(--gold); }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; max-width:980px; margin:24px auto; padding:0 16px; }
  .cell { background:#1b1a23; border:1px solid rgba(255,255,255,.08); border-radius:6px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .cell b { font:600 13px system-ui; } .cell span { color:var(--muted); font-size:12px; text-align:center; }
  h2 { font:600 14px system-ui; text-align:center; color:var(--muted); margin-top:28px; }
  .switcher { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:4px; background:#fff; color:#111; border-radius:999px; padding:6px; box-shadow:0 6px 24px rgba(0,0,0,.5); font:600 13px system-ui; z-index:9; }
  .switcher button { border:0; background:#eee; border-radius:999px; width:32px; height:32px; font-size:16px; cursor:pointer; }
  .switcher .label { padding:0 12px; min-width:220px; text-align:center; }
</style>

function outlined(rows) {
  const w = Math.max(...rows.map(r => r.length)) + 2, h = rows.length + 2;
  const at = (x, y) => { const r = rows[y - 1]; const c = r && r[x - 1]; return c && c !== "." ? c : null; };
  const out = [];
  for (let y = 0; y < h; y++) { let l = ""; for (let x = 0; x < w; x++) { const o = at(x, y); if (o) { l += o; continue; }

let variant = Math.max(0, VARIANTS.findIndex(v => v.key === new URLSearchParams(location.search).get("variant")));
let zoom = 5, tick = 0;
const canvas = document.getElementById("scene"), g = canvas.getContext("2d");

// Draws a grid with its bottom-left at art column x (from the band's left) and row (up from the bottom).
function draw(rows, x, row, palette, opts = {}) {
  const h = rows.length;
  rows.forEach((r, y) => [...r].forEach((ch, i) => {
    let c = ch === "K" ? PAL.K : palette[ch];
    if (!c) return;
    const col = opts.mirror ? x + r.length - 1 - i : x + i;
    g.globalAlpha = opts.alpha ?? 1;
    g.fillStyle = c;
    g.fillRect(col * zoom, (ROWS - row - h + y) * zoom, zoom, zoom);

// A spirit's glow: a pale ring one pixel out from the outline.
function glow(rows, x, row, alpha, mirror) {
  const h = rows.length, w = rows[0].length, on = (i, j) => rows[j] && rows[j][i] && rows[j][i] !== ".";
  g.globalAlpha = alpha; g.fillStyle = "#8cd2ff";

    if (on(i, j)) continue;
    let near = false; for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) if (on(i + c, j + b)) near = true;

}
function figure(a, x) {
  const cloth = { C: CLASS[a.cls], D: tint(CLASS[a.cls], 0.62), S: PAL.S, s: PAL.s };
  draw(SEAT, x - 1, ROW.seat, PAL);
  draw(SIT, x, ROW.seated, cloth);
}
// The Crew's faction is your own (whispers don't cross factions), so the cat is the night elf's or the tauren's.
let faction = "Alliance";
function resolved(f) { const form = FORMS[f]; return form.byFaction ? Object.assign({}, form, form.byFaction[faction]) : form; }
function formPal(f) { return FORM_PAL[resolved(f).pal]; }

function actor(a) {
  const left = FIRE_X + a.x;          // the actor's left edge in band columns
  const facingLeft = a.x > 0;         // right of the fire: turn to face it
  const v = VARIANTS[variant].key;
  const form = resolved(a.form);
  if (a.form === "none") { figure(a, left); return; }
  if (v === "B") {
    figure(a, left);
    const hood = outlined(G[form.hood]);
    draw(hood, left - 1, ROW.seated + SIT.length - 3, formPal(a.form));
    return;
  }
  let name = form.still, x = left, mirror = facingLeft, clawsAt = false;
  if (v === "C") {
    if (form.move) {
      // Trot to and fro over 4 columns from the seat outwards, away from the fire, turning at each end.
      const span = 4, step = Math.floor(tick / 2) + a.seed;
      const p = step % (span * 2);
      const off = p < span ? p : span * 2 - p;
      const outward = p < span;
      name = form.move[Math.floor(tick / 2) % 2];
      x = facingLeft ? left + off : left - off;
      mirror = facingLeft ? !outward : outward; // sprites face right
    } else {
      // Idle: the second frame now and then (a blink, a swish), the bear breathes slowly.
      // Now and then (every 10 s) the bear rears up and swipes: up 3 ticks, swipe 2, up 2.
      const phase = (tick + a.seed * 9) % 60;
      if (form.swipe && phase < 7) { name = phase === 3 || phase === 4 ? "bearSwipe" : "bearRear"; clawsAt = phase === 3 || phase === 4; }
      const beat = form.breathe ? Math.floor((tick + a.seed) / 9) % 2 : ((tick + a.seed) % 24 < 3 ? 1 : 0);

    const c = G.bearClaws, cw = c[0].length, col = 16, top = 4;

function poofs(a) {
  if (VARIANTS[variant].key !== "C" || !a.poof) return;

  if (age > 5) { a.poof = null; return; }
  const name = a.poof.kind + (age % 2 + 1);
  const rows = G[name];
  draw(rows, FIRE_X + a.x + 6 - Math.floor(rows[0].length / 2), ROW.ground + 2, FORM_PAL[a.poof.kind], { alpha: age > 3 ? 0.5 : 1 });

function render() {
  canvas.width = COLS * zoom; canvas.height = ROWS * zoom;
  g.imageSmoothingEnabled = false;
  g.fillStyle = "#0e0d14"; g.fillRect(0, 0, canvas.width, canvas.height);
  if (backdrop.complete) g.drawImage(backdrop, 0, canvas.height - backdrop.height * zoom, backdrop.width * zoom, backdrop.height * zoom);
  draw(LOGS, FIRE_X - 7, ROW.logs, PAL);
  draw(FIRE[tick % 3], FIRE_X - 5, ROW.fire, PAL);
  cast.forEach(actor);
  cast.forEach(poofs);
}

function shift(a) {
  const list = CYCLE[a.cls]; if (!list) return;
  const next = list[(list.indexOf(a.form) + 1) % list.length];
  const kind = (FORMS[next].poof || FORMS[a.form].poof);
  a.poof = kind ? { kind, at: tick } : null;
  a.form = next;

}
canvas.addEventListener("click", (e) => {
  const r = canvas.getBoundingClientRect();
  const col = (e.clientX - r.left) / r.width * COLS - FIRE_X;
  const hit = cast.reduce((best, a) => Math.abs(col - a.x - 6) < Math.abs(col - best.x - 6) ? a : best);
  if (hit) shift(hit);

function setVariant(i) {
  variant = (i + VARIANTS.length) % VARIANTS.length;
  const v = VARIANTS[variant];
  const u = new URL(location); u.searchParams.set("variant", v.key); history.replaceState(null, "", u);

document.getElementById("next").onclick = () => setVariant(variant + 1);
document.addEventListener("keydown", (e) => {

  if (e.key === "ArrowRight") setVariant(variant + 1);

}

    const b = document.createElement("button");

}

    ["wolfSit", "oldWolf", "Before: Ghost Wolf, sitting", "first draft"], ["oldWolfRun1", "oldWolf", "Before: trot", "first draft"],
    ["bearStand", "bear2", "Bear, standing", "A; C breathes"], ["bearRear", "bear2", "Bear, rearing", "C, every 10 s"], ["bearSwipe", "bear2", "Bear, swipe", "C"], ["bearLie", "bear", "Before: Bear, lying", "first draft"], ["catElf", "catElf", "Cat, night elf (Alliance)", "A; C idle"], ["catElfSwish", "catElf", "Cat, night elf, swish", "C"], ["catLion", "catLion", "Cat, tauren (Horde)", "A; C idle"], ["catLionSwish", "catLion", "Cat, tauren, swish", "C"], ["oldCatSit", "cat", "Before: Cat, sitting", "first draft"], ["travelStand", "travel", "Travel, standing", "A"],
    ["travelRun1", "travel", "Travel, run 1", "C"], ["travelRun2", "travel", "Travel, run 2", "C"], ["oldTravelLie", "oldTravel", "Before: Travel, lying", "first draft"], ["seal", "seal", "Aquatic", "A; C waves"], ["seal2", "seal", "Aquatic, wave", "C"], ["oldSeal", "oldSeal", "Before: Aquatic", "first draft"],
