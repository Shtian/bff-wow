<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: a gathering figure in the Pocket Camp holds a static pick over its head. What
  should an animated gathering pose look like?
  Round 1 (today's pick, swing, node, crouch, find mark): the node won. Feedback: the pick is too crooked at
  the ends, herbalism should look like picking flowers, and the hide doesn't read as an animal (a tiny bit of
  blood). Round 2 keeps round 1's node as a baseline and offers three sets, each a pick, a way of picking
  flowers and an animal to skin (mix and match across them):
    1  Round 1 node: the crooked pick, a sickle at a herb, a knife at a flat hide.
    A  An even arch of a pick; bends, plucks a flower and holds it up; a boar, cut standing.
    B  A straight pick with pale points; kneels and picks flowers into a basket; a wolf, cut kneeling.
  Round 3: B was liked; the wolf should look more dead. The Wolf toggle: X eyes and a tongue out (default),
  belly up with its legs stiff in the air (also X eyes and tongue, 20 columns long), or round 2's.
    C  A one-sided miner's pick; kneels and gathers a bouquet in the hand; the boar, its hide peeling back.
  The picks are drawn by hand at each angle (round 1 rotated one shape, which bent the diagonals). The animal
  lies behind the figure's legs, its head toward the fire, so it reaches about 7 past the figure (the anvil
  reaches 4, the griffin 8). Each cut drips a drop of blood, and there's a 2-pixel stain under the animal.
  Profession: "Mixed" puts a herbalist on Mira, a miner on You and a skinner on Kesh. The Camp only knows
  "gathering" today. Professions.practised already sees which skill line grew (182 herbalism, 186 mining,
  393 skinning) from a record Core merged, so naming it sends nothing new.
  Toggles: who gathers, profession, season, the game world behind, the backdrop's opacity, zoom (2x is about
  in-game size), pause and step. The readout lists, per gatherer, how far it reaches past its 12 columns, what
  it draws over, and what new sprites the set needs.
  Figures, palette, fire, hat and pick are copied from scripts/camp-art.mjs; backdrops are
  Media/CampPocketBackdrop*.tga's 144-column band. Crew data is fake. Run: open the file in a browser.
-->

<title>Camp gathering</title>
<style>
  :root { --gold:#ffd14a; --text:#e8e6e3; --muted:#adabb8; --dim:#8c8a99; --raised:#1b1a23; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text); background:#14121b; font:14px/1.4 system-ui, sans-serif; padding-bottom:96px; }
  h1 { font-size:18px; margin:20px 16px 4px; text-align:center; }
  h2 { font-size:14px; color:var(--gold); margin:24px 16px 6px; text-align:center; }
  .note { text-align:center; color:var(--muted); max-width:760px; margin:0 auto 10px; padding:0 16px; min-height:42px; }
  #toggles { display:flex; flex-wrap:wrap; gap:10px 18px; justify-content:center; margin:12px 16px; color:var(--muted); font-size:13px; }
  .group { display:flex; gap:4px; align-items:center; }
  .group button, .btn { font:13px system-ui; color:var(--text); background:var(--raised); border:1px solid rgba(255,255,255,.14); padding:4px 10px; border-radius:4px; cursor:pointer; }
  .group button.on { background:var(--gold); color:#1a1400; border-color:var(--gold); }
  .group input[type=range] { width:110px; }
  .stage { display:flex; justify-content:center; padding:0 16px; overflow-x:auto; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  .readout { max-width:760px; margin:8px auto 0; padding:0 16px; font:12px/1.5 ui-monospace, Menlo, monospace; color:var(--dim); }
  .readout b { color:var(--text); font-weight:600; }
  .readout .warn { color:#f0a21c; }
  .readout .ok { color:#70e370; }
  .switcher { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:4px; background:#fff; color:#111; border-radius:999px; padding:6px; box-shadow:0 6px 24px rgba(0,0,0,.5); font:600 13px system-ui; z-index:9; }
  .switcher button { border:0; background:#eee; border-radius:999px; width:32px; height:32px; font-size:16px; cursor:pointer; }
  .switcher .label { padding:0 12px; min-width:170px; text-align:center; }
</style>

    const i = y * W + x;
    if (gathering && owner[i] && owner[i] !== who && !owner[i].startsWith(who + ":")) {
      const h = (hits[who] = hits[who] || {});
      const o = owner[i].split(":")[0];
      h[o] = (h[o] || 0) + 1;
    }
    const [r, g, b] = hex(color);
    out.data.set([r, g, b, 255], i * 4);
    owner[i] = gathering ? who + ":gather" : who;
  };
  const stamp = (rows, x, row, pal, who, mirror) => rows.forEach((line, i) => [...line].forEach((ch, j) => {
    if (ch === ".") return;
    const c = ch === "K" ? PAL.K : pal[ch];
    if (c) put(mirror ? x + line.length - 1 - j : x + j, row + rows.length - 1 - i, c, who);
  }));
  const commit = (l, m, stats) => {
    const mirror = m.x > 0;
    for (const [k, c] of l.px) {
      const [u, r] = k.split(",").map(Number);
      put(mirror ? m.x + 11 - u : m.x + u, r, c, m.id, true);
      stats.min = Math.min(stats.min, u); stats.max = Math.max(stats.max, u); stats.top = Math.max(stats.top, r);
    }
  };

  const v = VARIANTS[variant].key;
  const gatherers = GATHERERS[state.who];
  const planned = CAST.map((m) => {
    const gathering = gatherers.includes(m.id);
    return { m, gathering, parts: gathering ? parts(m, tick + OFFSET[m.id] * 3, v) : null };
  });
  const stats = {};
  for (const { m, gathering } of planned) if (gathering) stats[m.id] = { min: 99, max: -99, top: 0 };

  const f = Math.floor(tick / 2) % 3;
  stamp(LOGS, -7, 3, PAL, "fire");
  stamp(FIRE[f], -5, 5, PAL, "fire");
  for (const { m, gathering } of planned) {
    if (m.pet != null) stamp(CAT_ART, m.pet, 3, PAL, "cat", false);
    if (!gathering) stamp(SEAT, m.x - 1, 3, PAL, m.id);
  }
  for (const { m, gathering, parts: pp } of planned) {
    const pal = { ...PAL, C: CLASS[m.cls], D: shade(CLASS[m.cls], 0.62) };
    const mirror = m.x > 0;
    if (!gathering) {
      stamp(SIT, m.x, 4, pal, m.id, mirror);
      if (m.hat) stamp(STRAW_HAT, m.x - 1, 4 + 13 - 2 + 4 + 2 - STRAW_HAT.length, PAL, m.id);
      continue;
    }
    for (const l of pp.back) commit(l, m, stats[m.id]);
    const body = BODY[pp.body];
    stamp(body, m.x, 3, pal, m.id, mirror);
    if (m.hat) stamp(STRAW_HAT, m.x - 1, 3 + body.length - 2 + 4 + 2 - STRAW_HAT.length, PAL, m.id);
  }
  for (const { m, gathering, parts: pp } of planned) {
    if (!gathering) continue;
    for (const l of pp.front) commit(l, m, stats[m.id]);
  }
  ctx.putImageData(out, 0, 0);

  const name = (o) => (o === "fire" ? "the fire/logs" : o === "cat" ? "your cat" : CAST.find((c) => c.id === o)?.name || o);
  const lines = [`<b>${phase}</b> · ${v} ${VARIANTS[variant].name} · ${state.prof} · season: ${state.season} · world: ${state.world} · backdrop ${state.opacity}% · tick ${tick}`,
    `new sprites: ${VARIANTS[variant].sprites}`];
  for (const { m, gathering } of planned) {
    if (!gathering) continue;
    const s = stats[m.id], h = hits[m.id] || {};
    const toward = Math.max(0, s.max - 11), away = Math.max(0, -s.min);
    const over = Object.entries(h).map(([o, n]) => `${name(o)} ${n}px`);
    lines.push(`<b>${m.name}</b> ${profFor(m)} (${m.x < 0 ? "left" : "right"} side): reaches ${toward} toward the fire, ${away} away, up to row ${s.top} · ` +
      (over.length ? `<span class="warn">draws over ${over.join(", ")}</span>` : `<span class="ok">draws over nothing</span>`));
  }
  document.getElementById(id + "-out").innerHTML = lines.join("<br>");
}

function draw() { render("night", "night"); render("day", "day"); }

function buildToggles() {
  const host = document.getElementById("toggles");
  host.innerHTML = "";
  const group = (label, key, options) => {
    const g = document.createElement("div"); g.className = "group"; g.append(label + " ");
    for (const [value, text] of options) {
      const b = document.createElement("button"); b.textContent = text; b.className = String(state[key]) === String(value) ? "on" : "";
      b.onclick = () => { state[key] = value; sync(); buildToggles(); draw(); };
      g.append(b);
    }
    host.append(g);
  };
  group("Gathering", "who", [["all", "Three"], ["you", "You"], ["kesh", "Kesh"], ["both", "Both sides"], ["neighbours", "Neighbours"]]);
  group("Profession", "prof", [["mixed", "Mixed"], ["mining", "Mining"], ["herbalism", "Herbalism"], ["skinning", "Skinning"]]);
  group("Wolf (B)", "wolf", [["wolfX", "X eyes"], ["wolfUp", "Legs up"], ["wolf", "Round 2"]]);
  group("Season", "season", [["none", "None"], ["winter", "Winter"]]);
  group("World", "world", [["forest", "Forest"], ["meadow", "Meadow"], ["snow", "Snow"]]);
  group("Zoom", "zoom", [[2, "2x"], [3, "3x"], [5, "5x"]]);
  const g = document.createElement("div"); g.className = "group"; g.append("Backdrop ");
  const r = document.createElement("input"); r.type = "range"; r.min = 0; r.max = 100; r.value = state.opacity;
  const val = document.createElement("span"); val.textContent = state.opacity + "%";
  r.oninput = () => { state.opacity = +r.value; val.textContent = r.value + "%"; sync(); draw(); };
  g.append(r, val); host.append(g);
}
function sync() {
  const p = new URLSearchParams({ variant: VARIANTS[variant].key, who: state.who, prof: state.prof, wolf: state.wolf, season: state.season, world: state.world, opacity: state.opacity, zoom: state.zoom });
  history.replaceState(null, "", "?" + p);
  const v = VARIANTS[variant];
  document.getElementById("label").textContent = `${v.key} (${v.name})`;
  document.getElementById("note").textContent = v.note;
}
function step(d) { variant = (variant + d + VARIANTS.length) % VARIANTS.length; sync(); draw(); }
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("pause").onclick = (e) => { paused = !paused; e.target.textContent = paused ? "Play" : "Pause"; };
document.getElementById("step").onclick = () => { tick++; draw(); };
addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
loadImages().then(() => { buildToggles(); sync(); draw(); setInterval(() => { if (paused) return; tick++; draw(); }, 1000 / 6); });
</script>
</body>
