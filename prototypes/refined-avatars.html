<!doctype html>

  PROTOTYPE, throwaway. Question: the Camp figures are cute but a tad too simple. How much more detail, and where?
  DECISION (2026-11-28): A, Tailored. Same 12x13 silhouette, four cloth tones, hair, blush, clasp, belt, boots.
  Today: 12x13, one hood-and-tunic shape in two cloth tones (C/D, tinted by the class colour), skin, 1-px eyes.
  Takes, all keeping the two-layer rule (digit tones 1-4 are cloth, multiplied by the class colour; every letter is a fixed colour):
    Today  the shipped figure.
    A      Tailored: same silhouette and 12x13, so a drop-in. Four cloth tones lit from above-left, hair under the hood,
           blush, a belt and buckle, leather boots, a quilted bedroll.
    B      Big head: still 12x13, but the head takes 8 rows: tall 1x2 eyes, a mouth, blush, happy ^^ eyes on the hop.
    C      Taller: 12x17 (+4 rows). Room for a cape, arms apart from the body, hands on knees, trousers and boots.
    D      Firelit: A, plus a warm rim of firelight on the fire side (night only) and a hair colour per Member from a hash
           of their name (local, nothing sent).
  Switch with the bottom bar or ←/→ (?variant=today|A|B|C|D).
  Run: open the file in a browser.
-->

<style>

  .controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:0 16px 14px; }

  .card b { font:500 13px var(--friz); }
  .card span { color:var(--muted); font-size:12px; }
  .card span.over { color:var(--bad); }
  .over { color:var(--bad); }
  .legend { color:var(--muted); font-size:12px; margin:-4px 0 8px; }

// ---------- Head pieces, a few from camp-art.mjs HATS ----------
function outlined(rows) {
  const w = rows[0].length + 2, h = rows.length + 2;
  const at = (x, y) => (rows[y-1] && rows[y-1][x-1] && rows[y-1][x-1] !== "." ? rows[y-1][x-1] : null);
  const out = [];
  for (let y = 0; y < h; y++) { let line = "";
    for (let x = 0; x < w; x++) { const own = at(x, y); if (own) { line += own; continue; }
      let near = false; for (let j=-1;j<=1;j++) for (let i=-1;i<=1;i++) if (at(x+i,y+j)) near = true;
      line += near ? "K" : "."; }
    out.push(line); }
  return out;
}
const HATS = [
  { brow: 4, rows: ["......vv..",".....uV...","...vuVVv..","..vuVGVVv.","vvuuVVVVvv"] },

const VARIANTS = [
  { key: "today", name: "Today", set: TODAY, forehead: 2, note: "The shipped figure: one hood-and-tunic shape in two cloth tones, 1-pixel eyes, skin hands. Every class differs only by tint." },
  { key: "A", name: "Tailored", set: A, forehead: 2, note: "<b>Same silhouette, 12×13, a drop-in.</b> Four cloth tones lit from above-left, a hair fringe under the hood, blush, a placket and gold clasp, a belt with buckle, leather boots, a quilted bedroll with a turned-down hem. Every pose built off the seated one (stand, crouch, walk, wave) keeps working." },

// ---------- Classes ----------
const CLASSES = [
  ["WARRIOR","Warrior","#C79C6E","Brakka"],["PALADIN","Paladin","#F58CBA","Aldwin"],["HUNTER","Hunter","#ABD473","Fenna"],
  ["ROGUE","Rogue","#FFF569","Nix"],["PRIEST","Priest","#FFFFFF","Maelis"],["SHAMAN","Shaman","#0070DE","Toruk"],
  ["MAGE","Mage","#69CCF0","Ysolde"],["WARLOCK","Warlock","#9482C9","Vexa"],["DRUID","Druid","#FF7D0A","Oakley"],
].map(([id,name,color,who], i) => ({ id, name, color, who, hat: i, rgb:[1,3,5].map(k => parseInt(color.slice(k,k+2),16)) }));
const BY_ID = Object.fromEntries(CLASSES.map(c => [c.id, c]));
const hash = s => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };

// ---------- Drawing ----------
const state = { variant: "A", day: false, hats: false, awake: false, paused: false, tick: 0 };
const mirrorRows = rows => rows.map(r => [...r].reverse().join(""));
function sprite(v, cls, pose) {
  const rows = v.set[pose];
  const parts = [{ rows, x: 0, y: -rows.length, bed: pose === "asleep", fig: true }];
  if (state.hats && pose !== "asleep") {
    const hat = HATS[BY_ID[cls].hat % HATS.length], w = hat.rows[0].length;
    const lift = pose === "hop" && v.key === "C" ? 0 : 0;
    parts.push({ rows: hat.rows, x: Math.floor((12 - w) / 2), y: -rows.length + v.forehead - (hat.brow + 1) - lift });
  }
  return { baseW: 12, parts };
}
function extents(s) {
  let min = Infinity, max = -Infinity, top = 0;
  for (const p of s.parts) { min = Math.min(min, p.x); max = Math.max(max, p.x + p.rows[0].length - 1); top = Math.min(top, p.y); }
  return { min, max, w: max - min + 1, h: -top };
}
function mirror(s) {
  return { baseW: s.baseW, flipped: true, parts: s.parts.map(p => ({ ...p, rows: mirrorRows(p.rows), x: s.baseW - (p.x + p.rows[0].length) })) };
}
const mix = (a, b, f) => a.map((v, i) => Math.round(v + (b[i] - v) * f));
const hex = c => [1,3,5].map(i => parseInt(c.slice(i,i+2),16));
const RIM = hex("#ffb04a");
function rgbOf(ch, cls, bed, who, v) {
  if (ch in TONE) return BY_ID[cls].rgb.map(x => Math.round(x * TONE[ch] * (bed ? 0.55 : 1)));
  if (v.hair && (ch === "h" || ch === "H")) return hex(HAIRS[hash(who) % HAIRS.length][ch === "h" ? 0 : 1]);
  return PAL[ch] ? hex(PAL[ch]) : null;
}
// fireSide: +1 means the fire is to the right of the sprite as drawn.
function drawSprite(ctx, s, ox, oy, cls, who, v, fireSide) {
  const rim = v.rim && !state.day && fireSide;
  for (const p of s.parts) {
    p.rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) {
      const ch = row[i]; if (ch === ".") continue;
      let c = rgbOf(ch, cls, p.bed, who, v); if (!c) continue;
      if (rim && ch !== "K") {
        const n = row[i + fireSide], nn = row[i + 2 * fireSide];
        if (n === "K" && (nn === undefined || nn === ".")) c = mix(c, RIM, p.fig ? 0.7 : 0.45);
      }
      ctx.fillStyle = `rgb(${c})`; ctx.fillRect(ox + p.x + i, oy + p.y + j, 1, 1);
    } });
  }
}
function drawGrid(ctx, rows, ox, oy) {
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const c = PAL[row[i]]; if (c) { ctx.fillStyle = c; ctx.fillRect(ox+i, oy+j, 1, 1); } } });
}

// ---------- Backdrop (simplified from camp-art.mjs), night and day ----------
const FIRE = [

];
const LOGS = ["..BB.......BB..",".BBBBb...bBBBB.","bbBBBBBBBBBBBbb","..bbbbbbbbbbb.."];
const W = 300, H = 56, Z = 3, GROUND = 53;
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r => r.map(v => (v + .5) / 16));
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
function makeBackdrop(day) {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  const put = (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); };
  const rect = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); };
  const cx = W / 2, horizon = H - 13;
  const sky = day ? ["#3b62a8","#4a72b4","#5d84c0","#7399cc","#8fb0d8"] : ["#070a1e","#0a0d26","#0e1030","#141335","#1c1636"];
  for (let y = 0; y < horizon; y++) for (let x = 0; x < W; x++) {
    const f = (y / horizon) * (sky.length - 1), i = Math.floor(f), d = f - i;
    put(x, y, sky[Math.min(sky.length - 1, i + (d > BAYER[y % 4][x % 4] ? 1 : 0))]);
  }
  if (!day) for (let i = 0; i < W * .28; i++) { const x = Math.floor(rnd(i+1) * W), y = Math.floor(rnd(i+50) * (horizon - 8));
    put(x, y, rnd(i+9) > .8 ? "#fff3c4" : rnd(i+3) > .5 ? "#7d7f9e" : "#4a4c6e"); }
  for (let x = 0; x < W; x++) { const h = 7 + Math.round(3*Math.sin(x*.05) + 2*Math.sin(x*.13+1)); rect(x, horizon-h, 1, h, day ? "#5a6e8c" : "#0e0f26"); }
  const pine = (x, h, col) => { for (let y = 0; y < h; y++) { const w = Math.floor(((y % 5) + y * .55) * .62) + 1; rect(x-w, horizon-h+y, w*2+1, 1, col); } rect(x, horizon, 1, 2, col); };
  for (let i = 0; i < W / 9; i++) { const x = Math.floor(i*9 + rnd(i+20)*7), far = Math.abs(x - cx) < 30;
    if (far && rnd(i) > .3) continue; pine(x, 12 + Math.floor(rnd(i+70) * (far ? 5 : 11)), day ? "#2f4a3a" : "#090a18"); }
  const glow = day ? ["#3f6b34","#4a7a3a","#5a8540","#7a8a42","#9a8a44"] : ["#141019","#201619","#35231a","#573518","#7a4c18"];
  for (let y = horizon; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x - cx) / (day ? 26 : 52), dy = (y - (H - 5)) / 9, d = Math.sqrt(dx*dx + dy*dy);
    const v = Math.max(0, 1 - d) * (glow.length - 1), i = Math.floor(v);
    put(x, y, glow[Math.min(glow.length - 1, i + (v - i > BAYER[y % 4][x % 4] ? 1 : 0))]);
  }
  return c;
}
const BACKDROPS = { night: makeBackdrop(false), day: makeBackdrop(true) };
const current = () => VARIANTS.find(x => x.key === state.variant);

// ---------- Scene ----------
const scene = document.getElementById("scene");
scene.width = W * Z; scene.height = H * Z + 18;
const art = document.createElement("canvas"); art.width = W; art.height = H;
const SLEEPERS = ["ROGUE", "SHAMAN", "WARLOCK", "PALADIN"];
function drawScene() {
  const v = current(), ctx = art.getContext("2d"), t = state.tick;
  ctx.clearRect(0, 0, W, H); ctx.drawImage(BACKDROPS[state.day ? "day" : "night"], 0, 0);
  const cx = W / 2;
  drawGrid(ctx, LOGS, cx - 7, H - 4);
  drawGrid(ctx, FIRE[t % 3], cx - 5, GROUND - 12);
  const actors = CLASSES.map((c, i) => ({ cls: c.id, pose: !state.awake && SLEEPERS.includes(c.id) ? "asleep" : (i === t % 9 && t % 6 < 2 ? "hop" : "seated") }));
  actors.sort((a, b) => (a.pose === "asleep") - (b.pose === "asleep"));
  let L = cx - 9, R = cx + 9, side = 0;
  const placed = [];
  for (const a of actors) {
    let s = sprite(v, a.cls, a.pose);
    const left = side++ % 2 === 0;
    if (!left) s = mirror(s);
    const e = extents(s);
    let x0;
    if (left) { x0 = L - 1 - e.max; L = x0 + e.min - 4; } else { x0 = R - e.min; R = x0 + e.max + 1 + 4; }
    const lift = a.pose === "hop" ? 2 : 0;
    drawSprite(ctx, s, x0, GROUND - lift, a.cls, BY_ID[a.cls].who, v, left ? 1 : -1);
    placed.push({ ...a, x0, top: e.h });
  }
  const d = scene.getContext("2d");
  d.imageSmoothingEnabled = false;
  d.fillStyle = "#0e0d14"; d.fillRect(0, 0, scene.width, scene.height);
  d.drawImage(art, 0, 0, W * Z, H * Z);
  d.font = "12px 'Archivo Narrow', sans-serif"; d.textAlign = "center";
  for (const a of placed) { d.fillStyle = BY_ID[a.cls].color; d.fillText(BY_ID[a.cls].who, (a.x0 + 6) * Z, H * Z + 13); }
  return { overflow: L < 2 || R > W - 2, left: Math.round(cx - L), right: Math.round(R - cx) };
}

// ---------- Zoom: today vs current, three classes ----------
const zoom = document.getElementById("zoom");
const ZW = 118, ZS = 8;
function drawZoom() {
  const tall = Math.max(...["WARRIOR","MAGE","PRIEST","DRUID"].map(c => extents(sprite(current(), c, "seated")).h));
  const ZH = tall + 4;
  zoom.width = ZW * ZS; zoom.height = ZH * ZS;
  const a = document.createElement("canvas"); a.width = ZW; a.height = ZH;
  const ctx = a.getContext("2d");
  ctx.fillStyle = state.day ? "#4a7a3a" : "#201619"; ctx.fillRect(0, 0, ZW, ZH);
  const today = VARIANTS[0], v = current(), base = ZH - 2;
  ["WARRIOR", "MAGE", "PRIEST", "DRUID"].forEach((cls, i) => {
    const x = 2 + i * 29;
    drawSprite(ctx, sprite(today, cls, "seated"), x, base, cls, BY_ID[cls].who, today, 1);
    drawSprite(ctx, sprite(v, cls, "seated"), x + 14, base, cls, BY_ID[cls].who, v, 1);
  });
  const d = zoom.getContext("2d"); d.imageSmoothingEnabled = false;
  d.clearRect(0, 0, zoom.width, zoom.height); d.drawImage(a, 0, 0, ZW * ZS, ZH * ZS);
}

// ---------- Cards ----------
const cards = document.getElementById("cards");
const CW = 64, CH = 26, CG = 24, CZ = 4;
const cardEls = CLASSES.map(c => {
  const el = document.createElement("div"); el.className = "card";
  el.innerHTML = `<canvas width="${CW*CZ}" height="${CH*CZ}"></canvas><div class="t"><b style="color:${c.color}">${c.name}</b><span class="fp"></span></div>`;
  cards.appendChild(el);
  return { c, canvas: el.querySelector("canvas"), fp: el.querySelector(".fp") };
});
const cardArt = document.createElement("canvas"); cardArt.width = CW; cardArt.height = CH;
function drawCards() {
  const v = current(), ctx = cardArt.getContext("2d");
  for (const { c, canvas, fp } of cardEls) {
    ctx.fillStyle = state.day ? "#5d84c0" : "#141019"; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = state.day ? "#4a7a3a" : "#201619"; ctx.fillRect(0, CG, CW, CH - CG);
    drawSprite(ctx, sprite(v, c.id, "seated"), 2, CG, c.id, c.who, v, 1);
    drawSprite(ctx, sprite(v, c.id, "hop"), 17, CG - 2, c.id, c.who, v, 1);
    drawSprite(ctx, sprite(v, c.id, "asleep"), 33, CG, c.id, c.who, v, 1);
    const d = canvas.getContext("2d"); d.imageSmoothingEnabled = false;
    d.clearRect(0, 0, canvas.width, canvas.height); d.drawImage(cardArt, 0, 0, CW * CZ, CH * CZ);
    const es = extents(sprite(v, c.id, "seated")), ea = extents(sprite(v, c.id, "asleep"));
    const f = (e, bw, bh, label) => { const bad = e.w > bw || e.h > bh; return `<span class="${bad ? "over" : ""}">${label} ${e.w}×${e.h}</span>`; };
    fp.innerHTML = `${f(es, state.hats ? 99 : 12, state.hats ? 99 : 13, "seated")} · ${f(ea, 18, 6, "asleep")}`;
  }
}

// ---------- Roster rows ----------
const rowsEl = document.getElementById("rows");
const rowEls = CLASSES.map(c => {
  const el = document.createElement("div"); el.className = "row";
  el.innerHTML = `<div class="fig"><canvas></canvas></div><span class="nm" style="color:${c.color}">${c.who}</span><span class="st">by the fire</span>`;
  rowsEl.appendChild(el);
  return { c, canvas: el.querySelector("canvas") };
});
function drawRows() {
  const v = current();
  for (const { c, canvas } of rowEls) {
    const s = sprite(v, c.id, "seated"), e = extents(s);
    const a = document.createElement("canvas"); a.width = e.w; a.height = e.h;
    drawSprite(a.getContext("2d"), s, -e.min, e.h, c.id, c.who, v, 0);
    canvas.width = e.w * 2; canvas.height = e.h * 2;
    const d = canvas.getContext("2d"); d.imageSmoothingEnabled = false; d.drawImage(a, 0, 0, e.w * 2, e.h * 2);
  }
}

// ---------- State, switcher ----------
function render() {
  const v = current();
  document.getElementById("note").innerHTML = v.note;
  document.getElementById("vlabel").textContent = `${v.key === "today" ? "Today" : v.key + " (" + v.name + ")"}`;
  const band = drawScene(); drawZoom(); drawCards(); drawRows();
  const seated = extents(sprite({ ...v }, "WARRIOR", "seated"));
  const hairs = v.hair ? "\n\nhair by name\n" + CLASSES.map(c => `${c.who.padEnd(8)} ${["brown","black","blond","red","ash","chestnut"][hash(c.who) % HAIRS.length]}`).join("\n") : "";
  document.getElementById("state").textContent =
    `variant      ${v.key} (${v.name})\ntime         ${state.day ? "day" : "night"}\nhead pieces  ${state.hats}\neveryone up  ${state.awake}\ntick         ${state.tick}\n` +
    `seated       ${seated.w}×${v.set.seated.length}  (today 12×13${v.set.seated.length > 13 ? `, +${v.set.seated.length - 13} rows` : ""})\n` +
    `asleep       ${v.set.asleep[0].length}×${v.set.asleep.length}  (today 18×6)\n` +
    `band used    ${band.left} cols left, ${band.right} right of ${W / 2}${band.overflow ? "  ← OVERFLOWS" : ""}` + hairs;
}
function setVariant(k) {
  state.variant = k;
  const u = new URL(location.href); u.searchParams.set("variant", k); history.replaceState(null, "", u);
  render();
}
const keys = VARIANTS.map(v => v.key);
const step = d => setVariant(keys[(keys.indexOf(state.variant) + d + keys.length) % keys.length]);
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1);
});
const toggle = (id, k) => { const b = document.getElementById(id); b.onclick = () => { state[k] = !state[k]; b.classList.toggle("on", state[k]); render(); }; };
toggle("day", "day"); toggle("hats", "hats"); toggle("awake", "awake"); toggle("pause", "paused");

const errs = [];
for (const v of VARIANTS) for (const [pose, g] of Object.entries(v.set)) {
  if (g.some(r => r.length !== g[0].length)) errs.push(`${v.key} ${pose}: ragged rows (${g.map(r => r.length).join(",")})`);
  if (pose !== "asleep" && g[0].length !== 12) errs.push(`${v.key} ${pose}: ${g[0].length} wide, not 12`);
}
document.getElementById("errors").textContent = errs.join(" · ");

const q = new URLSearchParams(location.search).get("variant");
state.variant = keys.includes(q) ? q : "A";
render();
setInterval(() => { if (!state.paused) { state.tick++; render(); } }, 333);
</script>
</body>
</html>
