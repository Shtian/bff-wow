<!--
  PROTOTYPE, throwaway. Question: every crafting profession in the Pocket Camp shows the same static hammer and
  anvil (Professions.practised says "crafting" for any line but the gathering ones). Gathering is now animated
  (#328). What should alchemy, blacksmithing, enchanting, engineering, leatherworking, tailoring, cooking and
  first aid look like?
  Verdict so far: "At the bench" (round 1's set A): the figure kneels or stands at a prop on the ground toward the
  fire, as gathering does, and Core would keep that room clear as it does for the griffin and the boar. Round 1's
  set B (working in the lap on the seat) and today's pose are in git history.
  Round 2: the enchanter stands with its arms down and holds the rod in its near hand, and the smith swings only
  its near arm (raised beside the head, then forward onto the anvil); the far arm stays down. Arms raised over
  the head (the hop figure) didn't read as arms. Both need a standing figure with its arms down (STAND), and the
  smith two more with the near arm raised and forward. The engineer stands up when the gadget bangs.
  Professions.practised already sees the skill line that rose (171 alchemy, 164 blacksmithing, 333 enchanting,
  202 engineering, 165 leatherworking, 197 tailoring, 185 cooking, 129 first aid), so naming it sends nothing new.
  The readout under each scene says how far each pose reaches past the figure and what it draws over.
  ?strip=1 (with &only=alchemy,cooking, &from=, &count=, &z=) lays out every tick of each cycle side by side.
  Figures, palette, fire and hat are copied from scripts/camp-art.mjs and the gathering prototype; backdrops are
  Media/CampPocketBackdrop*.tga's 144-column band. Crew data is fake. Run: open the file in a browser.
-->

<style>
  :root { --gold:#ffd14a; --text:#e8e6e3; --muted:#adabb8; --dim:#8c8a99; --raised:#1b1a23; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text); background:#14121b; font:14px/1.4 system-ui, sans-serif; padding-bottom:32px; }
  h1 { font-size:18px; margin:20px 16px 4px; text-align:center; }
  h2 { font-size:14px; color:var(--gold); margin:24px 16px 6px; text-align:center; }
  .note { text-align:center; color:var(--muted); max-width:760px; margin:0 auto 10px; padding:0 16px; }
  #gallery { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:0 16px; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px; background:var(--raised); border:2px solid rgba(255,255,255,.1); border-radius:6px; color:var(--text); font:13px system-ui; cursor:pointer; }
  .tile.on { border-color:var(--gold); }
  .tile small { color:var(--dim); font-size:11px; }
  #toggles { display:flex; flex-wrap:wrap; gap:10px 18px; justify-content:center; margin:16px; color:var(--muted); font-size:13px; }
  .group { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .group button, .btn { font:13px system-ui; color:var(--text); background:var(--raised); border:1px solid rgba(255,255,255,.14); padding:4px 10px; border-radius:4px; cursor:pointer; }
  .group button.on { background:var(--gold); color:#1a1400; border-color:var(--gold); }
  .group input[type=range] { width:110px; }
  .stage { display:flex; justify-content:center; padding:0 16px; overflow-x:auto; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  .readout { max-width:760px; margin:8px auto 0; padding:0 16px; font:12px/1.5 ui-monospace, Menlo, monospace; color:var(--dim); }
  .readout b { color:var(--text); font-weight:600; }
  .readout .warn { color:#f0a21c; }
  .readout .ok { color:#70e370; }
</style>

  for (const { m, crafting, parts: pp } of planned) {
    if (m.pet != null) P.stamp(CAT_ART, m.pet, 3, PAL, "cat", false);
    if (!crafting || pp.seated) P.stamp(SEAT, m.x - 1, 3, PAL, m.id);
  }
  for (const { m, crafting, parts: pp } of planned) {
    if (!crafting) { P.figure(m, { body: "SIT", back: [], seated: true }); continue; }
    P.figure(m, pp, stats[m.id]);
  }
  for (const { m, crafting, parts: pp } of planned) if (crafting) for (const l of pp.front) P.commit(l, m, stats[m.id]);
  ctx.putImageData(P.out, 0, 0);

  const name = (o) => (o === "fire" ? "the fire/logs" : o === "cat" ? "your cat" : CAST.find((c) => c.id === o)?.name || o);
  const lines = [`<b>${phase}</b> · tick ${tick}`];
  for (const { m, crafting } of planned) {
    if (!crafting) continue;
    const s = stats[m.id], h = P.hits[m.id] || {};
    const over = Object.entries(h).map(([o, n]) => `${name(o)} ${n}px`);
    lines.push(`<b>${m.name}</b> ${PROFS.find((x) => x.key === profFor(m)).name}: reaches ${Math.max(0, s.max - 11)} toward the fire, ${Math.max(0, -s.min)} away · ` +
      (over.length ? `<span class="warn">draws over ${over.join(", ")}</span>` : `<span class="ok">draws over nothing</span>`));
  }
  document.getElementById(id + "-out").innerHTML = lines.join("<br>");
}

const TW = 40, TH = 30, TZ = 3, TCX = 20;
const reachSeen = {};
function renderTile(canvas, prof) {
  const ctx = canvas.getContext("2d");
  canvas.width = TW; canvas.height = TH;
  canvas.style.width = TW * TZ + "px"; canvas.style.height = TH * TZ + "px";
  drawWorld(ctx, state.world, TW, TH);
  const P = painter(ctx, TW, TH, TCX, TH - 2);
  const m = { id: "t", cls: "MAGE", x: 12, hat: false };
  const mm = { ...m, x: -1 };
  const pp = parts(prof, tick);
  const stats = { min: 0, max: 11 };
  const left = { ...m, x: -15 };
  if (pp.seated) P.stamp(SEAT, left.x - 1, 3, PAL, "t");
  P.figure(left, pp, stats);
  for (const l of pp.front) P.commit(l, left, stats);
  ctx.putImageData(P.out, 0, 0);
  ctx.fillStyle = "rgba(255,209,74,.5)";
  ctx.fillRect(TCX + left.x + 12, TH - 1, 1, 1);
  const seen = (reachSeen[prof] = reachSeen[prof] || { fore: 0, aft: 0 });
  seen.fore = Math.max(seen.fore, stats.max - 11); seen.aft = Math.max(seen.aft, -stats.min);
  return seen;
}

function buildGallery() {
  const host = document.getElementById("gallery");
  host.innerHTML = "";
  for (const p of PROFS) {
    const btn = document.createElement("button");
    btn.className = "tile" + (state.prof === p.key ? " on" : "");
    const c = document.createElement("canvas");
    const caption = document.createElement("div"); caption.textContent = p.name;
    const small = document.createElement("small"); small.dataset.prof = p.key;
    btn.append(c, caption, small);
    btn.onclick = () => { state.prof = state.prof === p.key ? "mixed1" : p.key; sync(); buildGallery(); buildToggles(); draw(); };
    btn.title = BLURB[p.key];
    host.append(btn);
  }
}
function drawGallery() {
  document.querySelectorAll("#gallery .tile").forEach((btn, i) => {
    const p = PROFS[i], seen = renderTile(btn.querySelector("canvas"), p.key);
    btn.querySelector("small").textContent = `reach ${seen.fore} toward fire, ${seen.aft} away`;
  });
}

function draw() { drawGallery(); render("night", "night"); render("day", "day"); }

function buildToggles() {
  const host = document.getElementById("toggles");
  host.innerHTML = "";
  const group = (label, key, options) => {
    const g = document.createElement("div"); g.className = "group"; g.append(label + " ");
    for (const [value, text] of options) {
      const b = document.createElement("button"); b.textContent = text; b.className = String(state[key]) === String(value) ? "on" : "";
      b.onclick = () => { state[key] = value; sync(); buildGallery(); buildToggles(); draw(); };
      g.append(b);
    }
    host.append(g);
  };
  group("Crafting", "who", [["all", "Everyone"], ["you", "You"], ["kesh", "Kesh"], ["both", "Both sides of the fire"], ["neighbours", "Neighbours"]]);
  group("Profession", "prof", [["mixed1", "Mix 1"], ["mixed2", "Mix 2"], ...PROFS.map((p) => [p.key, p.name])]);
  group("Season", "season", [["none", "None"], ["winter", "Winter"]]);
  group("World", "world", [["forest", "Forest"], ["meadow", "Meadow"], ["snow", "Snow"]]);
  group("Zoom", "zoom", [[2, "2x"], [3, "3x"], [5, "5x"]]);
  const g = document.createElement("div"); g.className = "group"; g.append("Backdrop ");
  const r = document.createElement("input"); r.type = "range"; r.min = 0; r.max = 100; r.value = state.opacity;
  const val = document.createElement("span"); val.textContent = state.opacity + "%";
  r.oninput = () => { state.opacity = +r.value; val.textContent = r.value + "%"; sync(); draw(); };
  g.append(r, val); host.append(g);
}
function sync() { history.replaceState(null, "", "?" + new URLSearchParams(state)); }
document.getElementById("pause").onclick = (e) => { paused = !paused; e.target.textContent = paused ? "Play" : "Pause"; };
document.getElementById("step").onclick = () => { tick++; draw(); };
function strip() {
  document.body.innerHTML = "";
  document.body.style.padding = "8px";
  const from = +(params.get("from") || 0), count = +(params.get("count") || 30);
  for (const p of PROFS.filter((x) => !params.get("only") || params.get("only").split(",").includes(x.key))) {
    const row = document.createElement("div"); row.style.cssText = "display:flex;gap:2px;margin:2px 0;align-items:center";
    const label = document.createElement("div"); label.textContent = p.name; label.style.cssText = "width:110px;font:12px system-ui;color:#ccc";
    row.append(label);
    for (let k = from; k < from + count; k++) { tick = k; const c = document.createElement("canvas"); renderTile(c, p.key); const z = +(params.get("z") || 2); c.style.width = TW * z + "px"; c.style.height = TH * z + "px"; row.append(c); }
    document.body.append(row);
  }
}
loadImages().then(() => { if (params.get("strip")) { strip(); return; } buildGallery(); buildToggles(); sync(); draw(); setInterval(() => { if (paused) return; tick++; draw(); }, 1000 / 6); });
</script>
