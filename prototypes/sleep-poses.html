<!doctype html>
<!--
  PROTOTYPE, throwaway. Question: what should an offline Member look like asleep at the Camp?
  DECISION (2026-11-28): B7, the bedroll with the body's shape under the quilt (A2) and the head in side profile:
  a round hood 1-2-2-1 deep round the back of the head, the face looking up, a 1-pixel eye, no nose, two breathing frames.
  Round 1 picked the bedroll over nightcap, curled up, dozing and against the pack; round 2 picked A2's quilt;
  B1-B6 were the head's steps on the way (front-on face read wrong lying down; the nose and a 3-row hood read blocky).
  Round 1 (bedroll, nightcap, curled up, dozing, against the pack) chose the bedroll; this is round 2, tweaks of it.
  Figures are the Tailored take (A in prototypes/refined-avatars.html). Two-layer rule as ever: digits are cloth
  (1-4 full tones, 5-8 the same tones at the bedroll's 55%), multiplied by the class colour; letters are fixed colours.
  Takes:
    A  Bedroll: today's pose in the Tailored style. 18x6, the CAMP_LAYOUT sleeper slot.
    B  Nightcap: the bedroll, the hood's tip flopped back like a nightcap with a pompom, a pillow, a hand out on the quilt. 18x6.
    C  Curled up: on their side on the ground, knees tucked, cloak pulled round, no bedroll. 15x6.
    D  Dozing: still on the seat, head bowed, eyes shut, arms folded. 12 wide like a seated Member.
    E  Against the pack: on the ground, back to a rucksack, legs out to the fire, hood over the eyes. 17x9.
  Every take breathes (two frames) and gets the same three z's as today, from its own head.
  Switch with the bottom bar or ←/→ (?variant=A..E). Run: open the file in a browser.
-->

const CLASSES = [
  ["WARRIOR","#C79C6E","Brakka"],["PALADIN","#F58CBA","Aldwin"],["HUNTER","#ABD473","Fenna"],
  ["ROGUE","#FFF569","Nix"],["PRIEST","#FFFFFF","Maelis"],["SHAMAN","#0070DE","Toruk"],
  ["MAGE","#69CCF0","Ysolde"],["WARLOCK","#9482C9","Vexa"],["DRUID","#FF7D0A","Oakley"],
].map(([id,color,who]) => ({ id, color, who, name: id[0] + id.slice(1).toLowerCase(), rgb:[1,3,5].map(k => parseInt(color.slice(k,k+2),16)) }));
const BY_ID = Object.fromEntries(CLASSES.map(c => [c.id, c]));

const state = { variant: "A", day: false, snow: false, most: false, paused: false, tick: 0 };
const current = () => VARIANTS.find(v => v.key === state.variant);
const mirrorRows = rows => rows.map(r => [...r].reverse().join(""));
function rgb(ch, cls) {
  if (ch in TONE) return `rgb(${BY_ID[cls].rgb.map(x => Math.round(x * TONE[ch]))})`;
  return PAL[ch];
}
// Draws rows with its bottom-left at (x, bottom). Returns nothing.
function draw(ctx, rows, x, bottom, cls, flip) {
  const g = flip ? mirrorRows(rows) : rows, y0 = bottom - g.length;
  g.forEach((row, j) => { for (let i = 0; i < row.length; i++) {
    const ch = row[i]; if (ch === ".") continue;
    ctx.fillStyle = rgb(ch, cls); ctx.fillRect(x + i, y0 + j, 1, 1);
  } });
}
const breath = (t, seed) => Math.floor((t + seed * 3) / 5) % 2;
function zCount(t, seed) { const s = Math.floor((t + seed * 2) / 4) % 5; return s === 4 ? 0 : Math.min(s + 1, 3); }
const Z_OFF = [[0, 0], [5, 3], [-1, 5]];
function drawSleeper(ctx, v, cls, x, ground, flip, t, seed) {
  const rows = v.frames[breath(t, seed)], w = rows[0].length, h = rows.length;
  const bottom = ground - (v.seat ? 1 : 0);
  draw(ctx, rows, x, bottom, cls, flip);
  if (state.snow && !v.seat) {
    ctx.fillStyle = SNOW;
    const top = bottom - h, from = flip ? 1 : w - 9;
    for (let i = 0; i < 8; i++) ctx.fillRect(x + from + i, top + (v.key === "E" ? 0 : 1), 1, 1);
  }
  const n = zCount(t, seed), top = bottom - h;
  for (let i = 0; i < n; i++) {
    const z = ZS[i], zx = flip ? x + w - 1 - (v.z[0] + Z_OFF[i][0]) - z[0].length + 1 : x + v.z[0] + Z_OFF[i][0];
    const zb = top + v.z[1] - Z_OFF[i][1];
    z.forEach((row, j) => { for (let k = 0; k < row.length; k++) if (row[k] === "Z") { ctx.fillStyle = state.day ? "#ffffff" : PAL.Z; ctx.fillRect(zx + k, zb - z.length + j, 1, 1); } });
  }
}
function drawAwake(ctx, cls, x, ground, flip) { draw(ctx, SEATED, x, ground - 1, cls, flip); }

];

const SEAT = ["BBBBBBBBBBBBBB","bbbbbbbbbbbbbb"];
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r => r.map(v => (v + .5) / 16));
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
function backdrop(W, H, day, snow) {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  const put = (x, y, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); };
  const rect = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); };
  const cx = W / 2, horizon = H - 13;
  const sky = day ? ["#3b62a8","#4a72b4","#5d84c0","#7399cc","#8fb0d8"] : ["#070a1e","#0a0d26","#0e1030","#141335","#1c1636"];
  for (let y = 0; y < horizon; y++) for (let x = 0; x < W; x++) {
    const f = (y / horizon) * (sky.length - 1), i = Math.floor(f), d = f - i;
    put(x, y, sky[Math.min(sky.length - 1, i + (d > BAYER[y % 4][x % 4] ? 1 : 0))]);
  }
  if (!day) for (let i = 0; i < W * .28; i++) { const x = Math.floor(rnd(i+1) * W), y = Math.floor(rnd(i+50) * (horizon - 8));
    put(x, y, rnd(i+9) > .8 ? "#fff3c4" : rnd(i+3) > .5 ? "#7d7f9e" : "#4a4c6e"); }
  for (let x = 0; x < W; x++) { const h = 7 + Math.round(3*Math.sin(x*.05) + 2*Math.sin(x*.13+1)); rect(x, horizon-h, 1, h, day ? "#5a6e8c" : "#0e0f26"); }
  const pine = (x, h, col) => { for (let y = 0; y < h; y++) { const w = Math.floor(((y % 5) + y * .55) * .62) + 1; rect(x-w, horizon-h+y, w*2+1, 1, col); } rect(x, horizon, 1, 2, col); };
  for (let i = 0; i < W / 9; i++) { const x = Math.floor(i*9 + rnd(i+20)*7), far = Math.abs(x - cx) < 30;
    if (far && rnd(i) > .3) continue; pine(x, 12 + Math.floor(rnd(i+70) * (far ? 5 : 11)), day ? "#2f4a3a" : "#090a18"); }
  const glow = snow ? (day ? ["#b4bece","#c4ccd8","#d4dae4","#e2e0dc","#eadcc4"] : ["#2a2e44","#353850","#4a4658","#6a5448","#8a6038"])
    : day ? ["#3f6b34","#4a7a3a","#5a8540","#7a8a42","#9a8a44"] : ["#141019","#201619","#35231a","#573518","#7a4c18"];
  for (let y = horizon; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x - cx) / (day ? 26 : 52), dy = (y - (H - 5)) / 9, d = Math.sqrt(dx*dx + dy*dy);
    const v = Math.max(0, 1 - d) * (glow.length - 1), i = Math.floor(v);
    put(x, y, glow[Math.min(glow.length - 1, i + (v - i > BAYER[y % 4][x % 4] ? 1 : 0))]);
  }
  return c;
}
const BD = {};
const bd = (W, H) => { const k = `${W}x${H}${state.day}${state.snow}`; return BD[k] || (BD[k] = backdrop(W, H, state.day, state.snow)); };

// ---------- The band ----------
const W = 300, H = 56, Z = 3, GROUND = 53;
const scene = document.getElementById("scene"); scene.width = W * Z; scene.height = H * Z + 18;
const art = document.createElement("canvas"); art.width = W; art.height = H;
const AWAKE = ["WARRIOR", "MAGE", "HUNTER", "PRIEST"];
function drawBand() {
  const v = current(), ctx = art.getContext("2d"), t = state.tick, cx = W / 2;
  ctx.drawImage(bd(W, H), 0, 0);
  for (const [r, x] of [[LOGS, cx - 7]]) r.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] !== ".") { ctx.fillStyle = PAL[row[i]]; ctx.fillRect(x + i, H - 4 + j, 1, 1); } });
  FIRE[t % 3].forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] !== ".") { ctx.fillStyle = PAL[row[i]]; ctx.fillRect(cx - 5 + i, GROUND - 12 + j, 1, 1); } });
  const awakeIds = state.most ? ["WARRIOR"] : AWAKE;
  const actors = [...awakeIds.map(id => ({ cls: id, up: true })), ...CLASSES.filter(c => !awakeIds.includes(c.id)).map(c => ({ cls: c.id, up: false }))];
  let L = cx - 9, R = cx + 9, side = 0, placed = [], dropped = 0;
  actors.forEach((a, n) => {
    const left = side % 2 === 0;
    const w = a.up ? 12 : v.frames[0][0].length;
    const x = left ? L - w : R;
    if (x < 2 || x + w > W - 2) { dropped++; return; }
    side++;
    if (left) L = x - 4; else R = x + w + 4;
    if (a.up || v.seat) SEAT.forEach((row, j) => { ctx.fillStyle = PAL[row[0]]; ctx.fillRect(x - 1, GROUND - 2 + j, 14, 1); });
    if (a.up) drawAwake(ctx, a.cls, x, GROUND, !left);
    else drawSleeper(ctx, v, a.cls, x, GROUND, !left, t, n);
    placed.push({ ...a, x, w });
  });
  const d = scene.getContext("2d"); d.imageSmoothingEnabled = false;
  d.fillStyle = "#0e0d14"; d.fillRect(0, 0, scene.width, scene.height);
  d.drawImage(art, 0, 0, W * Z, H * Z);
  d.font = "12px 'Archivo Narrow', sans-serif"; d.textAlign = "center";
  for (const a of placed) { d.fillStyle = BY_ID[a.cls].color; d.fillText(BY_ID[a.cls].who, (a.x + a.w / 2) * Z, H * Z + 13); }
  return { used: Math.round(R - L), dropped };
}

// ---------- Pocket Camp ----------
const PW = 120, PH = 34;
const pocket = document.getElementById("pocket"); pocket.width = PW * 4; pocket.height = PH * 4;
const part = document.createElement("canvas"); part.width = PW; part.height = PH;
function drawPocket() {
  const v = current(), ctx = part.getContext("2d"), t = state.tick, cx = PW / 2, g = PH - 3;
  ctx.drawImage(bd(PW, PH), 0, 0);
  FIRE[t % 3].forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] !== ".") { ctx.fillStyle = PAL[row[i]]; ctx.fillRect(cx - 5 + i, g - 12 + j, 1, 1); } });
  ctx.fillStyle = PAL.B; ctx.fillRect(cx - 9 - 13, g - 2, 14, 1); ctx.fillStyle = PAL.b; ctx.fillRect(cx - 9 - 13, g - 1, 14, 1);
  drawAwake(ctx, "WARLOCK", cx - 9 - 12, g, false);
  const w = v.frames[0][0].length;
  if (v.seat) { ctx.fillStyle = PAL.B; ctx.fillRect(cx + 9 - 1, g - 2, 14, 1); ctx.fillStyle = PAL.b; ctx.fillRect(cx + 9 - 1, g - 1, 14, 1); }
  drawSleeper(ctx, v, "DRUID", cx + 9, g, true, t, 1);
  const d = pocket.getContext("2d"); d.imageSmoothingEnabled = false; d.drawImage(part, 0, 0, PW * 4, PH * 4);
}

// ---------- Zoom ----------
const zoom = document.getElementById("zoom");
function drawZoom() {
  const v = current(), t = state.tick;
  const ZW = 3 * 34 + 4, ZH = 27;
  zoom.width = ZW * 8; zoom.height = ZH * 8;
  const a = document.createElement("canvas"); a.width = ZW; a.height = ZH;
  const ctx = a.getContext("2d");
  ctx.fillStyle = state.day ? "#5d84c0" : "#141019"; ctx.fillRect(0, 0, ZW, ZH);
  ctx.fillStyle = state.snow ? "#4a4658" : state.day ? "#4a7a3a" : "#201619"; ctx.fillRect(0, ZH - 2, ZW, 2);
  ["WARRIOR", "MAGE", "DRUID"].forEach((cls, i) => {
    const x = 2 + i * 34;
    drawAwake(ctx, cls, x, ZH - 2, false);
    drawSleeper(ctx, v, cls, x + 14, ZH - 2, false, t, i);
  });
  const d = zoom.getContext("2d"); d.imageSmoothingEnabled = false; d.drawImage(a, 0, 0, ZW * 8, ZH * 8);
}

// ---------- Cards ----------
const cards = document.getElementById("cards");
const CW = 40, CH = 24, CZ = 4;
const cardEls = CLASSES.map(c => {
  const el = document.createElement("div"); el.className = "card";
  el.innerHTML = `<canvas width="${CW*CZ}" height="${CH*CZ}"></canvas><div class="t"><b style="color:${c.color}">${c.name}</b><span class="fp"></span></div>`;
  cards.appendChild(el);
  return { c, canvas: el.querySelector("canvas"), fp: el.querySelector(".fp") };
});
const cardArt = document.createElement("canvas"); cardArt.width = CW; cardArt.height = CH;
function drawCards() {
  const v = current(), ctx = cardArt.getContext("2d");
  cardEls.forEach(({ c, canvas, fp }, i) => {
    ctx.fillStyle = state.day ? "#5d84c0" : "#141019"; ctx.fillRect(0, 0, CW, CH);
    ctx.fillStyle = state.snow ? "#4a4658" : state.day ? "#4a7a3a" : "#201619"; ctx.fillRect(0, CH - 2, CW, 2);
    drawAwake(ctx, c.id, 2, CH - 2, false);
    drawSleeper(ctx, v, c.id, 18, CH - 2, false, state.tick, i);
    const d = canvas.getContext("2d"); d.imageSmoothingEnabled = false; d.drawImage(cardArt, 0, 0, CW * CZ, CH * CZ);
    const w = v.frames[0][0].length, h = v.frames[0].length;
    fp.innerHTML = `<span class="${w > 18 ? "over" : w < 18 ? "under" : ""}">asleep ${w}×${h}${w !== 18 ? ` (${w > 18 ? "+" : ""}${w - 18})` : ""}</span>`;
  });
}

function render() {
  const v = current();
  document.getElementById("note").innerHTML = v.note;
  document.getElementById("vlabel").textContent = `${v.key} (${v.name})`;
  const band = drawBand(); drawZoom(); drawCards(); drawPocket();
  const w = v.frames[0][0].length, h = v.frames[0].length;
  document.getElementById("state").textContent =
    `variant      ${v.key} (${v.name})\ntime         ${state.day ? "day" : "night"}${state.snow ? ", winter" : ""}\n` +
    `sleeper      ${w}×${h}  (slot today 18×6${w !== 18 ? `, ${w > 18 ? "+" : ""}${w - 18} cols` : ""})\n` +
    `rests on     ${v.seat ? "the seat log, like an awake Member" : "the ground"}\n` +
    `breath       frame ${breath(state.tick, 0) + 1} of 2\ntick         ${state.tick}\n` +
    `band         ${state.most ? 1 : 4} awake, ${9 - (state.most ? 1 : 4) - band.dropped} asleep shown${band.dropped ? `, ${band.dropped} don't fit (+${band.dropped})` : ", everyone fits"}\n` +
    `band used    ${band.used} of ${W} columns`;
}
function setVariant(k) {
  state.variant = k;
  const u = new URL(location.href); u.searchParams.set("variant", k); history.replaceState(null, "", u);
  render();
}
const keys = VARIANTS.map(v => v.key);
const step = d => setVariant(keys[(keys.indexOf(state.variant) + d + keys.length) % keys.length]);
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1);
});
const toggle = (id, k) => { const b = document.getElementById(id); b.onclick = () => { state[k] = !state[k]; b.classList.toggle("on", state[k]); render(); }; };
toggle("day", "day"); toggle("snow", "snow"); toggle("most", "most"); toggle("pause", "paused");

const errs = [];
for (const v of VARIANTS) v.frames.forEach((g, f) => {
  if (g.some(r => r.length !== g[0].length)) errs.push(`${v.key} frame ${f + 1}: ragged (${g.map(r => r.length).join(",")})`);
  if (g.length !== v.frames[0].length || g[0].length !== v.frames[0][0].length) errs.push(`${v.key} frame ${f + 1}: size differs from frame 1`);
});
document.getElementById("errors").textContent = errs.join(" · ");

const q = new URLSearchParams(location.search).get("variant");
state.variant = keys.includes(q) ? q : "B7";
render();
setInterval(() => { if (!state.paused) { state.tick++; render(); } }, 200);
</script>
</body>
